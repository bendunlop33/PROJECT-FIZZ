<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Progress Simple Prototype</title>
<style>
/* Progress, simplified (Ben, 21 Oct: "separate the page into key areas … overall progress vs plan/goals … review with changes, feedback"; "looks a bit complicated").
   Two areas: 1 How it's going (glance), 2 This week's review (feedback + changes). Detail one tap deeper. Example data only. Direction D tokens. */
:root {
  --canvas: #0D0C0B; --surface: #181615; --raised: #23201E; --divider: #302C29;
  --text: #F3EEE8; --text2: #B5ADA5; --text3: #948C84; --accent: #EDE5DA; --on-accent: #0D0C0B;
  --data: #E8C9A0; --page: #1B1917; --ui: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--text); font-family: var(--ui); margin: 0; }
.wrap { padding: 16px 12px 40px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.ctrl { width: 390px; max-width: 100%; display: flex; flex-direction: column; gap: 6px; }
.lab { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--text3); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--divider); background: var(--surface); color: var(--text2); font: 600 14px var(--ui); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.hint { color: var(--text2); font-size: 13px; text-align: center; max-width: 390px; line-height: 1.45; }
.phone { width: 390px; max-width: 100%; height: 800px; background: var(--canvas); border: 1px solid var(--divider); border-radius: 40px; padding: 16px 16px 10px; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; }
.status { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; padding: 0 6px; }
.scroll { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
h1 { font-size: 28px; font-weight: 700; margin: 2px 0 0; }
.sec { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--text2); font-weight: 600; margin: 6px 2px -4px; }
.card { background: var(--surface); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.k { color: var(--text2); font-size: 15px; }
.v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.pd { min-height: 52px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; gap: 1px; }
.pd small { font-size: 12px; font-weight: 500; }
.pd.done { background: var(--data); color: var(--on-accent); }
.pd.next { border: 1.5px solid var(--text2); }
.pd.next small { color: var(--text2); }
.pd.open { border: 1.5px dashed var(--divider); }
.goal { display: flex; flex-direction: column; gap: 8px; }
.meter { height: 10px; border-radius: 5px; background: var(--raised); position: relative; overflow: hidden; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--data); border-radius: 5px; }
.sub { color: var(--text2); font-size: 14px; font-variant-numeric: tabular-nums; }
.more { background: none; border: 0; color: var(--text); font: 600 15px var(--ui); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--text3); cursor: pointer; align-self: flex-start; min-height: 40px; padding: 0; }
.note { font-size: 17px; line-height: 1.45; }
.tag { color: var(--text3); font-size: 12px; margin-left: 6px; }
.sug { background: var(--raised); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.sug .t { font-size: 16px; font-weight: 600; }
.sug .ba { font-size: 16px; font-variant-numeric: tabular-nums; }
.sug .ba s { color: var(--text3); }
.acts { display: flex; gap: 8px; }
.btn { min-height: 44px; border-radius: 999px; border: 1.5px solid var(--text3); background: none; color: var(--text); font: 600 16px var(--ui); cursor: pointer; padding: 0 18px; }
.btn.yes { background: var(--accent); color: var(--on-accent); border: 0; flex: 1; }
.done-line { color: var(--text2); font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
.list { display: flex; flex-direction: column; }
.li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--divider); font-size: 15px; }
.li:first-child { border-top: 0; padding-top: 0; }
.li span:last-child { color: var(--text2); font-variant-numeric: tabular-nums; text-align: right; }
.tabs { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .12em; color: var(--text3); padding: 10px 8px 0; border-top: 1px solid var(--divider); }
.tabs .on { color: var(--text); font-weight: 600; }
.toast { position: absolute; left: 14px; right: 14px; bottom: 60px; background: var(--raised); border: 1px solid var(--divider); border-radius: 14px; padding: 12px 14px; font-size: 15px; z-index: 30; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="ctrl">
    <span class="lab">Your goal (from Profile)</span>
    <div class="chips" id="goals"></div>
    <div class="chips" id="demo"></div>
  </div>
  <div class="phone" id="app"></div>
  <div class="hint">Example data. Two areas: <b>How it's going</b> (a glance at the plan and your goal) and <b>This week's review</b> (feedback and changes). Everything else is one tap away under "See more".</div>
</div>
<script>
(() => {
  const GOALS = [['plan', 'Follow the plan'], ['muscle', 'Build muscle'], ['strength', 'Get stronger']];
  const GOAL_LINE = {
    plan: { k: 'Planned sets this week', v: '27 of 28', pct: 96, sub: 'Last week 58 of 62' },
    muscle: { k: 'Sets this week', v: '30 of 62', pct: 48, sub: 'Last week 58 of 62 · Chest 8 of 12 so far' },
    strength: { k: 'Bench press', v: '102.5 × 6', pct: 70, sub: 'Up 2.5 kg in 3 weeks · target 110 × 6' },
  };
  const NOTE = {
    plan: 'Good week: every planned session and almost every set done.',
    muscle: 'Back and chest volume on plan. Shoulders a little light.',
    strength: 'Bench moving up. Row has stayed at 92.5 × 8 for 3 weeks.',
  };
  const SUG = {
    plan: { t: 'Cable row on Pull', b: '3 × 10–12', a: '3 × 8–10' },
    muscle: { t: 'Lateral raise on Upper', b: '3 sets', a: '4 sets' },
    strength: { t: 'Row on Pull', b: '3 × 8', a: '4 × 6' },
  };
  const DETAIL = [['Days trained', '4 of 4'], ['Planned sets', '58 of 62'], ['Bench press', '102.5 × 6'], ['Squat', '117.5 × 5'], ['Runs', '2']];
  let s = { goal: 'plan', coach: true, sug: 'open', more: false, toast: null };
  const app = document.getElementById('app');

  function controls() {
    document.getElementById('goals').innerHTML = GOALS.map(([k, l]) => `<button class="chip" data-a="goal" data-v="${k}" aria-pressed="${s.goal === k}">${l}</button>`).join('');
    document.getElementById('demo').innerHTML = `<button class="chip" data-a="coach" aria-pressed="${!s.coach}">${s.coach ? 'Coach connected' : 'Coach offline'}</button>`;
  }
  function going() {
    const g = GOAL_LINE[s.goal];
    return `<div class="sec">How it's going</div>
    <div class="card">
      <div class="row"><span class="k">This week</span><span class="v">2 of 4</span></div>
      <div class="strip" role="group" aria-label="This week: Push done Monday, Pull done Wednesday, Legs next, one more to go">
        <div class="pd done">Push ✓<small>Mon</small></div><div class="pd done">Pull ✓<small>Wed</small></div>
        <div class="pd next">Legs<small>next</small></div><div class="pd open"></div>
      </div>
      <div class="goal">
        <div class="row"><span class="k">${g.k}</span><span class="v" style="font-size:18px">${g.v}</span></div>
        <div class="meter" aria-hidden="true"><i style="width:${g.pct}%"></i></div>
        <div class="sub">${g.sub}</div>
      </div>
      ${s.more ? `<div class="list">${DETAIL.map(([a, b]) => `<div class="li"><span>${a}</span><span>${b}</span></div>`).join('')}</div>` : ''}
      <button class="more" data-a="more">${s.more ? 'Show less' : 'See more ›'}</button>
    </div>`;
  }
  function review() {
    const g = SUG[s.goal];
    let sug = '';
    if (s.coach && s.sug === 'open') sug = `<div class="sug"><div class="t">${g.t}</div><div class="ba"><s>${g.b}</s> → ${g.a}</div><div class="acts"><button class="btn yes" data-a="apply">Apply</button><button class="btn" data-a="skip">Skip</button></div></div>`;
    if (s.coach && s.sug === 'applied') sug = `<div class="done-line"><span>${g.t}: ${g.a} · applied</span><button class="more" data-a="undo">Undo</button></div>`;
    return `<div class="sec">This week's review</div>
    <div class="card">
      <div class="note">${s.coach ? `${NOTE[s.goal]}<span class="tag">Coach</span>` : `4 of 4 days · 58 of 62 sets<span class="tag">Not reviewed · Offline</span>`}</div>
      ${sug}
      <div class="list">
        <div class="li"><span>Changed last week</span><span>Squat 115 → 117.5 kg</span></div>
      </div>
      <button class="more" data-a="past">Past reviews ›</button>
    </div>`;
  }
  function view() {
    controls();
    app.innerHTML = `<div class="status"><span>09:41</span><span>●●● 82%</span></div>
      <div class="scroll"><h1>Progress</h1>${going()}${review()}</div>
      <div class="tabs"><span>TODAY</span><span>LIBRARY</span><span class="on">PROGRESS</span><span>PROFILE</span></div>
      ${s.toast ? `<div class="toast" role="status">${s.toast}</div>` : ''}`;
  }
  let tt;
  document.body.addEventListener('click', (ev) => {
    const t = ev.target.closest('[data-a]'); if (!t) return; const a = t.dataset.a; s.toast = null;
    if (a === 'goal') { s.goal = t.dataset.v; s.sug = 'open'; }
    if (a === 'coach') s.coach = !s.coach;
    if (a === 'more') s.more = !s.more;
    if (a === 'apply') s.sug = 'applied';
    if (a === 'undo') s.sug = 'open';
    if (a === 'skip') { s.sug = 'skipped'; s.toast = 'Skipped'; }
    if (a === 'past') s.toast = 'Opens the list of past weekly reviews';
    clearTimeout(tt); if (s.toast) tt = setTimeout(() => { s.toast = null; view(); }, 2500);
    view();
  });
  view();
})();
</script>
</body>
</html>
