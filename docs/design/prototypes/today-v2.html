<title>Today Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one phone screen. Top: date + coach bar. A 7-day strip (3 days back, today, 3 ahead) mixing workouts, runs and plan days. Then one recommended workout card (collapsed; tap to expand). Then quick alternatives and "Build your own". Direction D tokens, single dark. */
:root {
  --canvas: #0D0C0B; --surface: #181615; --raised: #23201E; --divider: #302C29;
  --text: #F3EEE8; --text2: #B5ADA5; --text3: #948C84; --accent: #EDE5DA; --on-accent: #0D0C0B;
  --done: #5CC98A; --done-sub: #15301F; --run: #7FB2E5; --run-sub: #172636; --warn: #F2B84B;
  --page: #1B1917;
  --ui: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--text); font-family: var(--ui); margin: 0; }
.wrap { padding: 24px max(16px, env(safe-area-inset-left, 0px)) 40px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.hint { color: var(--text2); font-size: 13px; text-align: center; max-width: 380px; line-height: 1.45; }
.phone { width: 380px; max-width: 100%; height: 800px; background: var(--canvas); border: 1px solid var(--divider); border-radius: 40px; padding: 18px 16px 10px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden; }
.scroll { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding-bottom: 8px; }
.status { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; padding: 0 6px; }
h1 { font-size: 26px; font-weight: 600; margin: 0; }
.label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--text2); }
.askrow { display: flex; gap: 8px; }
.askbar { flex: 1; display: flex; gap: 10px; align-items: center; min-height: 46px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--divider); background: var(--surface); color: var(--text2); font-size: 15px; font-family: inherit; cursor: pointer; text-align: left; }
.askbar span:first-child { color: var(--text); }
.mic { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--raised); color: var(--text); cursor: pointer; display: grid; place-items: center; flex: none; }
/* week strip */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.day { background: var(--surface); border: 0; border-radius: 12px; padding: 8px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--text); cursor: pointer; font-family: inherit; min-height: 86px; }
.day .dn { font-size: 11px; color: var(--text2); letter-spacing: .06em; }
.day .dd { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.day.today { outline: 2px solid var(--accent); outline-offset: -2px; }
.day.past { opacity: .9; }
.pip { font-size: 10.5px; line-height: 1.15; padding: 2px 4px; border-radius: 6px; max-width: 100%; text-align: center; }
.pip.lift { background: var(--done-sub); color: var(--done); }
.pip.liftp { border: 1px dashed var(--text3); color: var(--text2); }
.pip.run { background: var(--run-sub); color: var(--run); }
.pip.runp { border: 1px dashed var(--run); color: var(--run); }
.pip.rest { color: var(--text3); }
.planline { display: flex; justify-content: space-between; color: var(--text2); font-size: 13px; padding: 0 2px; }
.planline b { color: var(--text); font-weight: 600; }
/* recommended card */
.card { background: var(--surface); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; cursor: pointer; }
.card .big { font-size: 28px; font-weight: 600; letter-spacing: -.01em; }
.card .sub { color: var(--text2); font-size: 14px; margin-top: 2px; }
.card .why { font-size: 13px; color: var(--text2); display: flex; gap: 6px; align-items: baseline; }
.card .why i { font-style: normal; color: var(--warn); }
.chev { color: var(--text3); font-size: 20px; padding: 4px; transition: transform .15s; }
.card.open .chev { transform: rotate(90deg); }
.exl { display: none; flex-direction: column; }
.card.open .exl { display: flex; }
.ex { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; padding: 9px 0; border-top: 1px solid var(--divider); font-size: 15px; align-items: center; }
.ex .n { color: var(--text2); font-size: 13px; }
.ex .v { color: var(--text2); font-variant-numeric: tabular-nums; font-size: 14px; }
.notes { display: none; background: var(--raised); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; color: var(--text2); flex-direction: column; gap: 4px; }
.card.open .notes { display: flex; }
.notes b { color: var(--text); font-weight: 600; }
.acts { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.pill { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 999px; min-height: 52px; font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit; }
.ghost { background: none; color: var(--text); border: 1.5px solid var(--text3); border-radius: 999px; min-height: 52px; padding: 0 20px; font-size: 15px; cursor: pointer; font-family: inherit; }
/* alternatives */
.alts { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.alt { flex: none; min-width: 132px; background: var(--surface); border: 1.5px solid transparent; border-radius: 14px; padding: 10px 12px; text-align: left; color: var(--text); cursor: pointer; font-family: inherit; display: flex; flex-direction: column; gap: 3px; }
.alt.sel { border-color: var(--accent); }
.alt b { font-size: 15px; font-weight: 600; }
.alt small { color: var(--text2); font-size: 12.5px; }
.alt .tag { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text3); }
.rowlinks { display: flex; gap: 8px; }
.rowlinks button { flex: 1; min-height: 48px; border-radius: 14px; border: 1.5px dashed var(--divider); background: none; color: var(--text); font-size: 15px; cursor: pointer; font-family: inherit; }
.tabs { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .12em; color: var(--text3); padding: 10px 6px 0; border-top: 1px solid var(--divider); }
.tabs .on { color: var(--text); font-weight: 600; }
/* sheet */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.5); z-index: 19; }
.sheet { position: absolute; inset: auto 0 0 0; background: var(--surface); border-radius: 24px 24px 38px 38px; padding: 16px 16px 22px; display: flex; flex-direction: column; gap: 10px; z-index: 20; max-height: 75%; overflow-y: auto; }
.sheet h3 { margin: 0 4px; font-size: 18px; }
.sheet .it { background: var(--raised); border-radius: 12px; padding: 10px 12px; font-size: 14.5px; display: flex; justify-content: space-between; gap: 10px; }
.sheet .it small { color: var(--text2); }
.toast { position: absolute; left: 16px; right: 16px; bottom: 70px; background: var(--raised); border-radius: 12px; padding: 12px 14px; font-size: 14px; z-index: 25; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>

<div class="wrap">
  <div class="phone" id="app"></div>
  <div class="hint">Prototype with example data (Tue 20 Oct, 4-day split, long run planned Saturday). Tap a day to see what happened or is planned. Tap the recommended card to see the workout and what the coach based it on. Pick another option to swap the recommendation. Edit and Build your own open the builder.</div>
</div>

<script>
(() => {
  const WEEK = [
    { dn: 'SAT', dd: 17, past: true, items: [{ k: 'lift', t: 'Shoulders' }], detail: ['Shoulders · 58 min · DB press 32.5 × 6'] },
    { dn: 'SUN', dd: 18, past: true, items: [{ k: 'run', t: 'Run 12k' }], detail: ['Run 12 km · 1:02 · easy'] },
    { dn: 'MON', dd: 19, past: true, items: [{ k: 'rest', t: 'Rest' }], detail: ['Rest day'] },
    { dn: 'TUE', dd: 20, today: true, items: [], detail: [] },
    { dn: 'WED', dd: 21, items: [{ k: 'runp', t: 'Run 8k' }], detail: ['Planned: run 8 km'] },
    { dn: 'THU', dd: 22, items: [{ k: 'liftp', t: 'Legs' }], detail: ['Planned: Legs (moved from Fri, long run Sat)'] },
    { dn: 'FRI', dd: 23, items: [{ k: 'liftp', t: 'Back' }], detail: ['Planned: Back'] },
  ];
  const OPTIONS = [
    { id: 'chest', tag: 'Plan · next', name: 'Chest', main: 'Bench', min: 55, why: null, ex: [['Barbell bench press', '4 × 6 · 100'], ['Incline dumbbell press', '3 × 8 · 27.5'], ['Cable fly', '3 × 8 · 15'], ['Triceps pushdown', '3 × 8 · 30', 'a'], ['Cable crunch', '3 × 8 · 40', 'b']], notes: ['Bench: hit 8 reps on the top set → 102.5 kg'], based: ['Plan: Chest is next (day 1 of 4)', 'This week: long run Sat, so legs on Thu and upper body today', 'Last Chest, 13 Oct: bench 100 × 6 at RPE 8, so 100 kg again', 'Goal: strength · bench target 110 kg (est. 1RM 127)', 'Length: your usual 60 min; fits in about 55'] },
    { id: 'chest-arms', tag: 'Variation', name: 'Chest', main: 'Bench · arms superset', min: 52, ex: [['Barbell bench press', '4 × 6 · 100'], ['Incline dumbbell press', '3 × 8 · 27.5'], ['Machine chest press', '3 × 8 · 80'], ['Triceps pushdown', '3 × 8 · 30', 'a'], ['EZ-bar curl', '3 × 8 · 30', 'b']], notes: [] },
    { id: 'shoulders', tag: 'Plan', name: 'Shoulders', main: 'DB press', min: 58, ex: [['Dumbbell shoulder press', '4 × 6 · 32.5'], ['Lateral raise', '3 × 12 · 10', 'a'], ['Triceps pushdown', '3 × 8 · 30', 'b'], ['Rear-delt fly', '3 × 12 · 7.5'], ['Face pull', '3 × 12 · 22.5']], notes: [] },
    { id: 'legs', tag: 'Plan', name: 'Legs', main: 'Squat', min: 59, warn: 'Long run Saturday: Thursday is better for legs', ex: [['Back squat', '4 × 6 · 117.5'], ['Romanian deadlift', '3 × 8 · 105'], ['Leg press', '3 × 8 · 195'], ['Leg curl', '3 × 10 · 47.5', 'a'], ['Cable crunch', '3 × 10 · 40', 'b']], notes: [] },
    { id: 'hotel', tag: 'Recent', name: 'Hotel shoulders', main: '17 Oct', min: 35, ex: [['Dumbbell shoulder press', '3 × 10 · 22'], ['Lateral raise', '3 × 15 · 8'], ['Push-up', '3 × max']], notes: [] },
  ];
  let s = { sel: 'chest', open: false, sheet: null, toast: null };
  const app = document.getElementById('app');
  const MIC = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
  function view() {
    const o = OPTIONS.find((x) => x.id === s.sel);
    let n = 0;
    app.innerHTML = `
    <div class="status"><span>09:41</span><span>●●● 82%</span></div>
    <div class="scroll">
      <h1>Tuesday</h1>
      <div class="askrow"><button class="askbar" data-a="ask"><span>✦</span><span>Ask the coach</span></button><button class="mic" data-a="ask" aria-label="Speak to the coach">${MIC}</button></div>
      <div class="week">${WEEK.map((d, i) => `<button class="day${d.today ? ' today' : ''}${d.past ? ' past' : ''}" data-a="day" data-v="${i}" aria-label="${d.dn} ${d.dd}"><span class="dn">${d.today ? 'TODAY' : d.dn}</span><span class="dd">${d.dd}</span>${d.today ? `<span class="pip liftp">${o.name}</span>` : d.items.map((it) => `<span class="pip ${it.k}">${it.k === 'lift' ? '✓ ' : ''}${it.t}</span>`).join('')}</button>`).join('')}</div>
      <div class="planline"><span>4-day split · <b>Chest next</b></span><span>Runs this week <b>1 of 3</b></span></div>
      <div>
        <div class="label" style="margin:0 2px 6px">${o.tag.startsWith('Plan') ? 'Recommended' : 'Today'}</div>
        <div class="card${s.open ? ' open' : ''}">
          <div class="top" data-a="toggle" role="button" aria-expanded="${s.open}">
            <div><div class="big">${o.name}</div><div class="sub">${o.main} · ${o.ex.length} exercises · ~${o.min} min</div></div>
            <span class="chev">›</span>
          </div>
          ${o.warn ? `<div class="why"><i>!</i><span>${o.warn}</span></div>` : ''}
          <div class="exl">${o.ex.map(([nm, v, ss]) => { if (!ss || ss === 'a') n++; return `<div class="ex"><span class="n">${n}${ss ?? ''}</span><span>${nm}</span><span class="v">${v}</span></div>`; }).join('')}</div>
          ${o.notes.length ? `<div class="notes"><b>From last review</b>${o.notes.map((x) => `<span>${x}</span>`).join('')}</div>` : ''}
          ${o.based ? `<div class="notes"><b>Based on</b>${o.based.map((x) => `<span>· ${x}</span>`).join('')}</div>` : ''}
          <div class="acts"><button class="pill" data-a="start">Start</button><button class="ghost" data-a="edit">Edit</button></div>
        </div>
      </div>
      <div>
        <div class="label" style="margin:0 2px 6px">Or</div>
        <div class="alts">${OPTIONS.map((x) => `<button class="alt${x.id === s.sel ? ' sel' : ''}" data-a="pick" data-v="${x.id}"><span class="tag">${x.tag}</span><b>${x.name}</b><small>${x.main} · ~${x.min} min</small></button>`).join('')}</div>
      </div>
      <div class="rowlinks"><button data-a="build">Build your own</button><button data-a="activity">＋ Activity</button></div>
    </div>
    <div class="tabs"><span class="on">TODAY</span><span>LIBRARY</span><span>PROGRESS</span><span>PROFILE</span></div>
    ${s.sheet ? `<div class="scrim" data-a="close"></div><div class="sheet">${s.sheet}</div>` : ''}
    ${s.toast ? `<div class="toast">${s.toast}</div>` : ''}`;
  }
  app.addEventListener('click', (ev) => {
    const t = ev.target.closest('[data-a]'); if (!t) return;
    const a = t.dataset.a, v = t.dataset.v; s.toast = null;
    const o = OPTIONS.find((x) => x.id === s.sel);
    if (a === 'toggle') s.open = !s.open;
    if (a === 'pick') { s.sel = v; s.open = false; }
    if (a === 'day') { const d = WEEK[Number(v)]; s.sheet = d.today ? `<h3>Today</h3><div class="it"><span>${o.name} recommended</span><small>Plan day 2 of 4</small></div><button class="ghost" data-a="close">Close</button>` : `<h3>${d.dn[0] + d.dn.slice(1).toLowerCase()} ${d.dd} Oct</h3>${d.detail.map((x) => `<div class="it"><span>${x}</span><small>${d.past ? '' : 'Planned'}</small></div>`).join('')}${d.past ? '' : '<button class="ghost" data-a="close">Move or change (coach)</button>'}<button class="ghost" data-a="close">Close</button>`; }
    if (a === 'close') s.sheet = null;
    if (a === 'start') s.toast = `Started ${o.name} (prototype)`;
    if (a === 'edit') s.toast = 'Opens the builder on "Your workout" (page 2)';
    if (a === 'build') s.toast = 'Opens the builder on "Set up" (page 1)';
    if (a === 'activity') s.toast = 'Log or plan a run, ride or other activity';
    if (a === 'ask') s.toast = 'Opens the coach (type or speak): "legs, 45 min" fills in the builder';
    view();
  });
  view();
})();
</script>
