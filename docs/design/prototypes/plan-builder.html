<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan Builder Prototype</title>
<style>
/* Plan builder (draft spec docs/design/plan-builder.md, 22 Oct 2026). Example data only, never Ben's real history.
   Flow: Goals → Week → Your plan (proposal, edit by tap or coach chat) → Apply (Undo). Direction D tokens, single dark. */
:root {
  --canvas: #0D0C0B; --surface: #181615; --raised: #23201E; --divider: #302C29;
  --text: #F3EEE8; --text2: #B5ADA5; --text3: #948C84; --accent: #EDE5DA; --on-accent: #0D0C0B;
  --done: #5CC98A; --run: #7FB2E5; --run-sub: #172636; --warn: #F2B84B; --page: #0D0C0B;
  --ui: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--text); font-family: var(--ui); margin: 0; }
.wrap { padding: 16px 12px 40px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.ctrl { width: 390px; max-width: 100%; display: flex; flex-direction: column; gap: 6px; }
.lab { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--text3); }
.hint { color: var(--text2); font-size: 13px; text-align: center; max-width: 390px; line-height: 1.45; }
.phone { position: relative; width: 390px; max-width: 100%; height: min(820px, 100vh); height: min(820px, 100dvh); background: var(--canvas); border: 1px solid var(--divider); border-radius: 40px; padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.status { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; padding: 0 6px; }
.scroll { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 9px; padding-bottom: 8px; }
/* Scroll bars float like on iPhone, so content never changes width when a page starts to scroll */
.scroll, .sheet { scrollbar-width: none; }
.scroll::-webkit-scrollbar, .sheet::-webkit-scrollbar { display: none; }
.hdr { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 44px; }
h1 { font-size: 26px; font-weight: 600; margin: 0; }
.steps { color: var(--text3); font-size: 13px; font-variant-numeric: tabular-nums; }
.label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--text2); margin-top: 4px; }
/* Gym goals: every question shows; a circle right of each heading fills once answered, amber if Next is tapped first (Ben, 22 Oct) */
.label.q { display: flex; align-items: center; gap: 4px; }
.grp { font-size: 20px; font-weight: 600; margin: 10px 0 0; }
/* Any preferences, compact (Ben, 22 Oct): shorter boxes, tighter rows and headings */
.scroll.prefs { gap: 6px; }
.prefs .grp { font-size: 17px; margin: 6px 0 0; }
.prefs .qbox { gap: 5px; padding: 0 0 8px; }
.prefs .grid2 { gap: 5px; }
.prefs .grid2 .chip { min-height: 32px; padding: 2px 6px; font-size: 13px; border-radius: 10px; }
.prefs .label { font-size: 11px; }
.prefs .qdot { width: 12px; height: 12px; }
/* Questions separated by thin divider lines (Ben, 22 Oct: chosen over faint or tight boxes), on Gym goals and Your week */
.qbox { display: flex; flex-direction: column; gap: 9px; padding: 2px 0 12px; border-bottom: 1px solid var(--divider); }
.qbox > .label { margin-top: 0; }
.qbox:has(+ :not(.qbox)), .qbox:last-child { border-bottom: 0; }
.qdot { margin-left: auto; flex: 0 0 auto; width: 14px; height: 14px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid var(--text); }
.qdot.done { background: var(--text); }
.qdot.miss { border: 2px solid var(--warn); }
.card { background: var(--surface); border-radius: 20px; padding: 6px 16px; display: flex; flex-direction: column; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 52px; border-bottom: 1px solid var(--divider); font-size: 16px; }
.row:last-child { border-bottom: 0; }
.row .v { color: var(--text2); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--divider); background: var(--surface); color: var(--text2); font: 600 15px var(--ui); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg .chip { flex: 0 0 auto; min-height: 36px; min-width: 78px; padding: 0 6px; white-space: nowrap; border-radius: 12px; font-size: 13.5px; }
/* Yes / No: a joined segmented switch, so it reads as a question, not one of the options (Ben, 22 Oct). */
.yn { display: inline-flex; align-self: flex-start; padding: 3px; gap: 2px; border-radius: 999px; background: var(--surface); border: 1px solid var(--divider); }
.yn button { min-height: 32px; width: 92px; padding: 0 6px; white-space: nowrap; border-radius: 999px; border: 0; background: transparent; color: var(--text2); font: 600 14px var(--ui); cursor: pointer; }
/* Split boxes: equal 2×2 grid (Ben, 22 Oct) */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.grid2 .chip { min-height: 44px; padding: 4px 8px; white-space: normal; line-height: 1.2; border-radius: 12px; font-size: 13.5px; text-align: center; }
.yn button[aria-pressed="true"] { background: var(--raised); color: var(--text); box-shadow: inset 0 0 0 1px var(--text3); }
.chip.sm { min-height: 36px; min-width: 78px; font-size: 13.5px; padding: 0 6px; border-radius: 12px; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--raised); color: var(--text); font-size: 20px; cursor: pointer; }
.stepper span { min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
.link { background: none; border: 0; color: var(--text); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--text3); font-size: 15px; cursor: pointer; padding: 0 4px; min-height: 44px; }
.link.dim { color: var(--text2); }
.primary { min-height: 52px; border-radius: 999px; border: 0; background: var(--accent); color: var(--on-accent); font: 600 17px var(--ui); cursor: pointer; width: 100%; }
.footer { display: flex; flex-direction: column; gap: 6px; }
.askrow { display: flex; gap: 8px; }
.askbar { flex: 1; display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 14px; border-radius: 16px; border: 1.5px solid var(--divider); background: var(--surface); color: var(--text); font: 16px var(--ui); }
.askbar input { flex: 1; background: none; border: 0; color: var(--text); font: 16px var(--ui); outline: none; min-width: 0; }
.mic { width: 48px; height: 48px; border-radius: 16px; border: 1.5px solid var(--divider); background: var(--surface); color: var(--text); cursor: pointer; }
.target { display: flex; align-items: center; justify-content: space-between; min-height: 52px; border-bottom: 1px solid var(--divider); font-size: 16px; gap: 8px; }
.target:last-child { border-bottom: 0; }
.target .x { color: var(--text3); background: none; border: 0; font-size: 18px; min-width: 44px; min-height: 44px; cursor: pointer; }
/* week strip */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.day { background: var(--surface); border: 0; border-radius: 12px; padding: 6px 1px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text); cursor: pointer; font-family: var(--ui); min-height: 64px; }
.day .dn { font-size: 11px; color: var(--text2); letter-spacing: .06em; }
.pip { font-size: 10px; line-height: 1.2; padding: 3px 1px; border-radius: 6px; width: 100%; text-align: center; white-space: nowrap; overflow: hidden; }
.pip.lift { background: rgba(237,229,218,.12); color: var(--text); }
.pip.run { background: var(--run-sub); color: var(--run); }
.pip.rest { color: var(--text3); }
.day.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
.daypick .day { min-height: 52px; justify-content: center; font-size: 13px; font-weight: 600; }
.daypick .day[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.daypick .day[aria-pressed="true"] .dn { color: var(--on-accent); }
.daypick .day.runday { box-shadow: inset 0 0 0 1.5px var(--run); }
/* plan */
.blk { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--text2); }
.dcard { background: var(--surface); border-radius: 18px; padding: 4px 14px; }
.dtop { display: flex; justify-content: space-between; align-items: center; min-height: 56px; cursor: pointer; gap: 8px; }
.dtop .nm { font-size: 17px; font-weight: 600; }
.dtop .sub { font-size: 13px; color: var(--text2); }
.dtop .rt { display: flex; align-items: center; gap: 6px; color: var(--text2); font-size: 13px; font-variant-numeric: tabular-nums; }
.chev { color: var(--text3); font-size: 18px; transition: transform .15s; }
.open .chev { transform: rotate(90deg); }
.ex { display: none; border-top: 1px solid var(--divider); padding: 4px 0 8px; }
/* Opened day (Ben, 22 Oct): exercises sit in an inset, darker panel with smaller type, so they read apart from the day header */
.wkstrip { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; flex-shrink: 0; padding-bottom: 1px; }
.wkstrip .chip { min-width: 34px !important; flex: 1 0 34px; padding: 0 2px; position: relative; }
.wkstrip .dl { font-size: 9px; color: var(--text3); position: absolute; right: 5px; top: 3px; }
.ex .rows > div[data-exw] { cursor: pointer; }
.ex .rows { background: var(--canvas); border-radius: 12px; padding: 2px 12px; margin: 8px -4px 4px; }
.ex .rows > div { font-size: 14px !important; min-height: 36px !important; border-bottom: 1px solid color-mix(in srgb, var(--divider) 60%, transparent) !important; }
.ex .rows > div:last-child { border-bottom: 0 !important; }
.open .ex { display: block; }
.exr { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 0; border-bottom: 1px solid var(--divider); font-size: 15px; }
.exr:last-of-type { border-bottom: 0; }
.exr .w { color: var(--text2); font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; }
.exr .m { color: var(--text3); font-size: 12px; }
.exr.main .n { font-weight: 600; }
.dact { display: flex; gap: 4px; flex-wrap: wrap; }
.vol { display: grid; grid-template-columns: 92px 1fr 52px; align-items: center; gap: 8px; min-height: 30px; font-size: 14px; }
.bar { position: relative; height: 8px; background: var(--raised); border-radius: 4px; }
.bar .rng { position: absolute; top: 0; bottom: 0; background: rgba(237,229,218,.16); border-radius: 4px; }
.bar .fill { position: absolute; top: 2px; height: 4px; left: 0; background: var(--accent); border-radius: 2px; }
.vol .n { text-align: right; color: var(--text2); font-variant-numeric: tabular-nums; }
.vol.pri .mn::after { content: " ★"; color: var(--warn); font-size: 11px; }
.note { font-size: 13px; color: var(--text2); display: flex; gap: 6px; align-items: center; }
.why { background: var(--raised); border-radius: 14px; padding: 10px 12px; font-size: 14px; color: var(--text2); line-height: 1.45; display: none; }
.why.on { display: block; }
.chat { display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 85%; padding: 8px 12px; border-radius: 16px; font-size: 15px; line-height: 1.4; }
.msg.ben { align-self: flex-end; background: var(--raised); }
.msg.co { align-self: flex-start; color: var(--text); padding-left: 0; }
.msg.co b { color: var(--text2); font-weight: 500; font-size: 12px; display: block; }
.choice { display: flex; gap: 8px; }
.choice button { flex: 1; min-height: 44px; border-radius: 12px; border: 1.5px solid var(--divider); background: var(--surface); color: var(--text); font: 600 15px var(--ui); cursor: pointer; }
/* sheet + toast */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.5); display: none; z-index: 20; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 85%; overflow-y: auto; background: var(--surface); border-radius: 24px 24px 0 0; padding: 14px 16px 24px; z-index: 21; display: none; flex-direction: column; gap: 10px; }
.sheet.on, .scrim.on { display: flex; }
.sheet h2 { font-size: 18px; margin: 0; }
.toast { position: absolute; left: 14px; right: 14px; bottom: 84px; background: var(--raised); border: 1px solid var(--divider); border-radius: 14px; padding: 4px 6px 4px 14px; font-size: 15px; z-index: 30; display: none; justify-content: space-between; align-items: center; }
.toast.on { display: flex; }
.badge { font-size: 12px; color: var(--text3); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 420px) {
  .wrap { padding: 12px 0 40px; }
  .ctrl, .hint { padding: 0 12px; }
  .phone { border-radius: 0; border-left: 0; border-right: 0; height: 100vh; height: 100dvh; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="ctrl">
    <span class="lab">Prototype controls</span>
    <div class="chips">
      <button class="chip sm" id="aiOn" aria-pressed="true">Coach on</button>
      <button class="chip sm" id="aiOff" aria-pressed="false">Offline</button>
      <button class="chip sm" id="restart" aria-pressed="false">Start again</button>
      <button class="chip sm" id="editExisting" aria-pressed="false">Edit existing plan</button>
    </div>
  </div>
  <p class="hint">Opens from Today "Set up a plan ›", Library › Your plan, Profile › Goal and the coach. Example data only. Try the coach: "make it 3 days", "never leg extension", "I like hip thrust", "no legs before my long run", "more chest", "swap Saturday to arms".</p>

  <div class="phone" id="phone">
    <div class="status"><span>9:41</span><span>●●● 100%</span></div>
    <div class="hdr">
      <button class="link dim" id="back" aria-label="Back">‹ Back</button>

    <div class="scroll" id="scroll"></div>
    <div class="footer" id="footer"></div>

    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet"></div>
    <div class="toast" id="toast"><span id="toastText"></span><button class="link" id="undo">Undo</button></div>
  </div>
</div>

// Usual range of each lift's est. 1RM ÷ bench est. 1RM (crowd-sourced strength standards and coaching rules of thumb;
// shown as information, a supporting signal only). Extra lifts can be added on Check your lifts.
const BAL = {
  'Back squat': [1.2, 1.5], 'Barbell row': [0.7, 1.0], 'Dumbbell shoulder press': [0.22, 0.30],
  'Deadlift': [1.5, 1.9], 'Front squat': [0.95, 1.2], 'Romanian deadlift': [1.0, 1.3],
  'Overhead press': [0.6, 0.7], 'Incline bench press': [0.8, 0.9],
};
const EXTRA = ['Deadlift', 'Front squat', 'Romanian deadlift', 'Overhead press', 'Incline bench press'];
const checkLifts = () => [...MAIN, ...(S.extra ?? [])];
const hasData = (l) => !HIST[l].none || S.check[l] === 'entered' || S.check[l] === 'est';
const ratio = (l) => e1rm(HIST[l].kg, HIST[l].reps) / e1rm(HIST['Barbell bench press'].kg, HIST['Barbell bench press'].reps);
const balWord = (l) => { const v = ratio(l), [lo, hi] = BAL[l]; return v < lo ? 'Below' : v > hi ? 'Above' : 'In range'; };
// Bench against the others: each other lift implies a usual bench range (its 1RM ÷ its usual ratio); bench's band is
// the average of those, so bench gets a Below / In range / Above like the rest (Ben, 22 Oct).
function benchRange(lifts) {
  const imp = lifts.map((l) => { const e = e1rm(HIST[l].kg, HIST[l].reps), [lo, hi] = BAL[l]; return [e / hi, e / lo]; });
  const avg = (i) => imp.reduce((t, r) => t + r[i], 0) / imp.length;
  return [avg(0), avg(1)];
}
function benchRow(lifts, row, dot) {
  if (!lifts.length) return '';
  const [lo, hi] = benchRange(lifts), b = e1rm(HIST['Barbell bench press'].kg, HIST['Barbell bench press'].reps);
  const min = lo * 0.6, max = hi * 1.4, pos = (x) => Math.max(0, Math.min(100, (x - min) / (max - min) * 100));
  const word = b < lo ? 'Below' : b > hi ? 'Above' : 'In range';
  return row('Barbell bench press', `<span class="rng" style="left:${pos(lo)}%;width:${pos(hi) - pos(lo)}%"></span>${dot(pos(b))}`, word, word === 'Below');
}
function balanceCard() {
  const head = `<div class="label" style="display:flex;align-items:center;gap:4px">Strength balance <button class="link dim" id="balInfo" aria-label="How this is worked out" style="text-decoration:none;font-size:16px;min-width:44px">ⓘ</button></div>`;
  const dot = (p) => `<span style="position:absolute;top:-2px;left:calc(${p}% - 7px);width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)"></span>`;
  const row = (name, bar, word, warn) => `<div class="vol" style="grid-template-columns:132px 1fr 84px;min-height:40px"><span class="mn" style="font-size:14px">${name}</span><span class="bar" style="height:10px">${bar}</span><span class="n" style="font-size:13px;color:${warn ? 'var(--warn)' : 'var(--text2)'}">${word}</span></div>`;
  const lifts = checkLifts().filter((l) => l !== 'Barbell bench press' && BAL[l] && hasData(l));
  const rows = lifts.map((l) => {
    const [lo, hi] = BAL[l]; const v = ratio(l);
    const min = lo * 0.6, max = hi * 1.4, pos = (x) => Math.max(0, Math.min(100, (x - min) / (max - min) * 100));
    const word = balWord(l);
    return row(SHORT[l], `<span class="rng" style="left:${pos(lo)}%;width:${pos(hi) - pos(lo)}%"></span>${dot(pos(v))}`, word, word === 'Below');
  }).join('');
  return `${head}<div class="card" style="padding:10px 16px;gap:6px">
      ${benchRow(lifts, row, dot)}
      ${rows}</div>`;
}
function balanceInfo() {
  const lifts = checkLifts().filter((l) => l !== 'Barbell bench press' && BAL[l] && hasData(l));
  sheet(`<h2>Strength balance</h2>
    <div class="note" style="display:block;line-height:1.45">Each lift's estimated 1RM divided by your bench press estimated 1RM. The shaded band is the usual range for lifters, from crowd-sourced strength standards and coaching rules of thumb. It's not a target: build, technique and how strictly you lift all move it. It only counts toward a priority with another sign, like low sets or a stalled lift.<br><br>Bench press is checked the other way round: the range your other lifts would usually go with.</div>
    <div class="card" style="padding:4px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;column-gap:16px">
      <span class="lab" style="padding:8px 0">Lift</span><span class="lab" style="padding:8px 0;text-align:center">You</span><span class="lab" style="padding:8px 0;text-align:center">Usual</span>
      ${(() => { if (!lifts.length) return ''; const [lo, hi] = benchRange(lifts), b = e1rm(HIST['Barbell bench press'].kg, HIST['Barbell bench press'].reps), r5 = (x) => Math.round(x / 2.5) * 2.5; const c = 'padding:8px 0;border-top:1px solid var(--divider)'; return `<span style="${c}">Barbell bench press</span><span style="${c};text-align:center;font-variant-numeric:tabular-nums">${r5(b)} kg</span><span style="${c};text-align:center;color:var(--text2);font-variant-numeric:tabular-nums">${r5(lo)}–${r5(hi)} kg</span>`; })()}
      ${lifts.map((l) => `<span style="padding:8px 0;border-top:1px solid var(--divider)">${SHORT[l]}</span><span style="padding:8px 0;border-top:1px solid var(--divider);text-align:center;font-variant-numeric:tabular-nums">${(Math.floor(ratio(l) * 100) / 100).toFixed(2)}×</span><span style="padding:8px 0;border-top:1px solid var(--divider);text-align:center;color:var(--text2);font-variant-numeric:tabular-nums">${BAL[l][0]}–${BAL[l][1]}×</span>`).join('')}
    </div>${S.ai ? '' : ''}`);
}

// Read-across (Ben, 22 Oct): a main lift with no history is estimated from his closest similar lift first, then
// from another main lift. Factors are practice-level rules of thumb, always labelled est., replaced by the first session.
const SIMILAR = {
  'Dumbbell shoulder press': [
    { from: 'Machine shoulder press', f: (h) => Math.floor(h.kg / 2 / 1.1 / 2) * 2, note: (h) => `${h.kg} × ${h.reps}` },
    { from: 'Overhead press', f: (h) => Math.floor(h.kg / 1.2 / 2 / 2) * 2, note: (h) => `${h.kg} × ${h.reps}` },
    { from: 'Barbell bench press', f: (h) => Math.floor(h.kg * 0.6 / 1.2 / 2 / 2) * 2, note: (h) => `${h.kg} × ${h.reps}` },
  ],
};
const estFrom = (l, i) => { const r = SIMILAR[l]?.[i]; if (!r || !HIST[r.from]) return null; const h = HIST[r.from]; return { kg: r.f(h), reps: h.reps, from: r.from, note: r.note(h), i }; };
const shortName = (l) => SHORT[l] ?? l.replace('DB ', 'DB ').replace('Machine ', 'Machine ');
// Pages: "Check your lifts" only when a main lift has no history or none in 8 weeks.
const needsCheck = () => MAIN.some((l) => HIST[l].none || HIST[l].stale);
const flow = () => [needsCheck() || S.checkSeen ? 'check' : null, 'goals', 'week', 'prefs', 'plan'].filter(Boolean);
function go(d) { const f = flow(); const i = Math.max(0, Math.min(f.length - 1, f.indexOf(S.page) + d)); S.page = f[i]; render(); }

function renderCheck() {
  S.checkSeen = true;
  const C = 'display:flex;align-items:center;justify-content:center;min-height:52px;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--divider)';
  const rows = checkLifts().map((l) => {
    const h = HIST[l], c = S.check[l];
    const { e, kg, reps, six } = startLoad(l), one = nearest(l, e1rm(kg, reps));
    const open = (h.stale && c !== 'yes' && c !== 'entered') || (h.none && !c);
    return `<button data-lift="${l}" style="display:contents;font:inherit;color:inherit;cursor:pointer">
      <span style="${C};justify-content:flex-start;gap:6px;text-align:left">${SHORT[l]}${open ? '<span style="width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none" aria-label="Check"></span>' : ''}</span>
      ${h.none && !e && c !== 'entered' ? `<span style="${C};color:var(--text3)">—</span><span style="${C};color:var(--text3)">—</span>` : `<span style="${C};flex-direction:column;color:${reps === 6 && !e ? 'var(--text)' : 'var(--text2)'}">${kgCell(l, six)}</span>
      <span style="${C};flex-direction:column;color:var(--text2)">${kgCell(l, one)}</span>`}</button>`;
  }).join('');
  $('scroll').innerHTML = `<h1>Check your lifts</h1>
    <div class="card" style="display:grid;grid-template-columns:minmax(0,1fr) 84px 84px;padding:4px 16px">
      <span class="lab" style="display:flex;align-items:center;min-height:32px">Lift</span><span class="lab" style="text-align:center;align-self:center">6 reps</span><span class="lab" style="text-align:center;align-self:center">1RM est.</span>
      ${rows}
      <button class="link" id="addLift" style="grid-column:1 / -1;justify-self:start">＋ Add a lift</button></div>
    <div class="note">Tap a lift to change it. Grey = estimate.</div>
    ${balanceCard()}`;
  if ($('balInfo')) $('balInfo').onclick = balanceInfo;
  if ($('addLift')) $('addLift').onclick = () => {
    const left = EXTRA.filter((l) => !(S.extra ?? []).includes(l));
    sheet(`<h2>Add a lift</h2><div class="card">${left.map((l) => `<button class="row" data-add="${l}" style="background:none;border:0;border-bottom:1px solid var(--divider);color:var(--text);font:inherit;width:100%;cursor:pointer;text-align:left"><span>${SHORT[l]}</span><span class="v">${HIST[l].none ? 'Enter' : '›'}</span></button>`).join('')}</div>`);
    document.querySelectorAll('[data-add]').forEach((b) => b.onclick = () => { const l = b.dataset.add; S.extra = [...(S.extra ?? []), l]; closeSheet(); render(); if (HIST[l].none) openLiftSheet(l); });
  };
  $('footer').innerHTML = `<button class="primary" id="next">Next</button>`;
  document.querySelectorAll('[data-lift]').forEach((b) => b.onclick = () => openLiftSheet(b.dataset.lift));
  $('next').onclick = () => go(1);
}
function openOtherSheet(l) {
  const opts = (SIMILAR[l] ?? []).map((_, i) => estFrom(l, i)).filter(Boolean);
  sheet(`<h2>Estimate ${SHORT[l]} from</h2><div class="card">${opts.map((e) => `<button class="row" data-pick="${e.i}" style="background:none;border:0;border-bottom:1px solid var(--divider);color:var(--text);font:inherit;width:100%;cursor:pointer;text-align:left"><span>${esc(e.from)}<br><span style="font-size:13px;color:var(--text3)">${esc(e.note)}</span></span><span class="v">est. ${e.kg}</span></button>`).join('')}</div>`);
  document.querySelectorAll('[data-pick]').forEach((b) => b.onclick = () => { S.src = { ...(S.src ?? {}), [l]: +b.dataset.pick }; closeSheet(); render(); });
}
function openLiftSheet(l) {
  const h = HIST[l]; const c = S.check[l];
  const e = (h.none && c !== 'entered') ? estFrom(l, S.src?.[l] ?? 0) : null;
  let kg = e ? e.kg : h.kg, reps = e ? e.reps : h.reps;
  const from = c === 'entered' ? 'You entered' : e ? `Estimated from ${e.from} ${e.note}` : h.none ? 'No history. Enter a recent set.' : `Last set: ${fmtKg(l, h.kg)} × ${h.reps} · ${h.date}`;
  const draw = () => {
    sheet(`<h2>${SHORT[l]}</h2><div class="note">${esc(from)}</div>
      <div class="card"><div class="row"><span>Weight</span><span class="stepper"><button id="wD" aria-label="Lighter">−</button><span>${fmtKg(l, kg)}</span><button id="wU" aria-label="Heavier">＋</button></span></div>
      <div class="row"><span>Reps</span><span class="stepper"><button id="rD" aria-label="Fewer">−</button><span>${reps}</span><button id="rU" aria-label="More">＋</button></span></div></div>
      ${h.none && (SIMILAR[l] ?? []).length > 1 ? `<button class="link dim" id="otherL" style="align-self:flex-start">Estimate from another lift</button>` : ''}
      <div class="choice">${h.stale && c !== 'yes' ? `<button id="okL">Still right</button>` : ''}<button id="saveL" style="background:var(--accent);color:var(--on-accent);border-color:var(--accent)">Save</button></div>`);
    const st = h.each ? 2 : 2.5;
    $('wD').onclick = () => { kg = Math.max(0, kg - st); draw(); }; $('wU').onclick = () => { kg += st; draw(); };
    $('rD').onclick = () => { reps = Math.max(1, reps - 1); draw(); }; $('rU').onclick = () => { reps += 1; draw(); };
    if ($('okL')) $('okL').onclick = () => { S.check[l] = 'yes'; closeSheet(); render(); };
    if ($('otherL')) $('otherL').onclick = () => openOtherSheet(l);
    $('saveL').onclick = () => {
      const changed = kg !== (e ? e.kg : h.kg) || reps !== (e ? e.reps : h.reps);
      if (changed || h.none) { Object.assign(HIST[l], { kg, reps, last: `${fmtKg(l, kg)} × ${reps} (you entered)`, none: false, stale: false }); S.check[l] = 'entered'; }
      else S.check[l] = 'yes';
      closeSheet(); render();
    };
  };
  draw();
}

      <span style="display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;font-size:14px;font-variant-numeric:tabular-nums;justify-items:end;border-top:1px solid var(--divider);padding-top:8px">
        ${lifts.map((lf) => { const t = tgt(lf); const end = projected(l, lf); const hit = t && end >= t.kg; const each = HIST[lf].each ? ' <span style="font-size:11px;color:var(--text3)">each</span>' : ''; return `<span style="color:var(--text2);justify-self:start">${SHORT[lf] ?? lf}</span><span style="color:var(--text3)">${HIST[lf].kg} →</span><span style="font-weight:600;color:${hit ? 'var(--done)' : 'var(--text)'}">${end}${each}</span>`; }).join('')}
      </span>
      ${S.targets.length ? `<span style="grid-column:1 / -1;font-size:13px;color:var(--text2);border-top:1px solid var(--divider);padding-top:6px">${S.targets.map((t) => { const w = whenReached(t.lift, t.kg, l); return `${SHORT[t.lift] ?? t.lift} ${t.kg}: ${w === 'now' ? 'already there' : w ? w + ' (est.)' : 'not within a year'}`; }).join(' · ')}</span>` : ''}</button>`; }).join('')}`;
  $('footer').innerHTML = `<button class="primary" id="next">Next: your week</button>`;
  document.querySelectorAll('[data-rm]').forEach((b) => b.onclick = () => { S.targets.splice(+b.dataset.rm, 1); render(); });
  document.querySelectorAll('[data-wk]').forEach((b) => b.onclick = () => { S.weeks = +b.dataset.wk; S.toDate = !!b.dataset.todate; render(); });
  document.querySelectorAll('[data-eff]').forEach((b) => b.onclick = () => { S.effort = b.dataset.eff; render(); });
  $('next').onclick = () => go(1);
}

  $('scroll').innerHTML = `

    <div class="yn" role="group">${['No', 'Yes'].map((o) => `<button data-ss="${o}" aria-pressed="${(S.supersets ? 'Yes' : 'No') === o}">${o}</button>`).join('')}</div>
    <div class="label">Gym</div>

  $('footer').innerHTML = `<button class="primary" id="next">Next: any preferences</button>`;

function compose(base, next, items, rejected) {

    </div></div>${e.role === 'main' && !e.bw ? `<div class="note" style="display:block">Warm-up this week: ${esc(warmUp(e.n, atWeek(e, S.week).top, atWeek(e, S.week).reps))}</div>` : ''}<div class="note">Planned. Each week follows what you actually lift.</div>`);
  });
  document.querySelectorAll('[data-toggle]').forEach((el) => el.onclick = () => { const i = +el.dataset.toggle; S.open = S.open === i ? -1 : i; render(); });
  document.querySelectorAll('[data-strip]').forEach((el) => el.onclick = () => { const i = p.findIndex((d) => d.day === +el.dataset.strip); S.open = i; render(); });
  document.querySelectorAll('[data-swap]').forEach((el) => el.onclick = () => openFocusSheet(+el.dataset.swap));
  document.querySelectorAll('[data-move]').forEach((el) => el.onclick = () => openMoveSheet(+el.dataset.move));
  // Do today (Ben, 22 Oct): this week's not-done days open on Today with its controls (shorten, main lift…; today only).
  document.querySelectorAll('[data-dotoday]').forEach((el) => el.onclick = () => { if (document.documentElement.classList.contains('embed')) parent.postMessage({ app: 'dotoday', day: el.dataset.dotoday }, '*'); else toast(`Opens ${el.dataset.dotoday} on Today`, false); });
  // Open in builder: that day's workout for the week shown, on the builder's Your workout page (V6).
  document.querySelectorAll('[data-open]').forEach((el) => el.onclick = () => { if (document.documentElement.classList.contains('embed')) parent.postMessage({ app: 'builder', draft: dayDraft(p[+el.dataset.open]) }, '*'); else toast('Opens this day in the workout builder', false); });
  document.querySelectorAll('[data-choice]').forEach((el) => el.onclick = () => { S.chat = S.chat.filter((c) => c.who !== 'choice'); const pending = S.pendingAsk; S.pendingAsk = null; el.dataset.choice === 'new' ? rebuild(pending) : editPlan(pending); });
  $('absChange').onclick = () => { sheet(`<h2>Ab sets a week</h2><div class="seg">${ABS_OPTS.map((n) => `<button class="chip" data-absn="${n}" style="min-width:0;flex:1 1 0" aria-pressed="${absPerWeek() === n}">${n === absAuto() ? '✦ ' : ''}${n}</button>`).join('')}</div>`); document.querySelectorAll('[data-absn]').forEach((b) => b.onclick = () => { ensureEditing(); const before = snapshot(); S.absWk = +b.dataset.absn; S.plan = build(); closeSheet(); render(); toast(`Abs ${S.absWk} sets a week`, true, () => { restore(before); render(); }); }); };
  $('whyBtn').onclick = () => $('why').classList.toggle('on');
  // The plan overview (Library › your plan, Ben 22 Oct): Edit plan starts an edit in place; Pause and End sit at the bottom.
  if ($('editPlan')) $('editPlan').onclick = () => { S.editing = true; S.applied = false; S.basePlan = JSON.parse(JSON.stringify(S.plan)); S.rejected = new Set(); S.scope = null; S.pageTop = true; render(); };
  document.querySelectorAll('[data-chg]').forEach((b) => b.onclick = () => { const id = b.dataset.chg; S.rejected.has(id) ? S.rejected.delete(id) : S.rejected.add(id); render(); });
  if ($('accAll')) $('accAll').onclick = () => { S.rejected = new Set(); render(); };
  if ($('rejAll')) $('rejAll').onclick = () => { S.rejected = new Set(changeItems().map((it) => it.id)); render(); };
  document.querySelectorAll('[data-scope]').forEach((b) => b.onclick = () => { if (b.disabled) return; const w = +b.dataset.scope; S.scope.has(w) ? S.scope.delete(w) : S.scope.add(w); render(); });
  if ($('pausePlan')) $('pausePlan').onclick = () => { S.paused = !S.paused; render(); toast(S.paused ? 'Plan paused' : 'Plan resumed', false); };
  // End plan: a title-only confirm, then Undo (V4). In the app the shell ends it and keeps this screen for Undo.
  if ($('endPlan')) $('endPlan').onclick = () => confirmSheet('End plan?', 'End plan', () => {
    if (document.documentElement.classList.contains('embed')) { parent.postMessage({ app: 'endplan' }, '*'); return; }
    const before = { applied: S.applied, paused: S.paused }; S.applied = false; S.paused = false; render();
    toast('Plan ended', true, () => { Object.assign(S, before); render(); });
  });
  if ($('apply')) $('apply').onclick = () => {
    // Undo puts back exactly what was there before Apply (V4).
    const before = { plan: S.plan, weekPlans: S.weekPlans, basePlan: S.basePlan, rejected: S.rejected, scope: S.scope, editing: S.editing, applied: S.applied };
    if (S.editing && S.basePlan) { const wp = {}; for (let w = 1; w <= S.weeks; w++) wp[w] = planFor(w); const last = wp[S.weeks]; S.weekPlans = wp; if (!S.record) S.plan = last; } S.applied = true; S.editing = false; S.basePlan = null; S.rejected = null; S.scope = null; render(); toast('Plan applied', true, () => { Object.assign(S, before); render(); }); };
  const ask = $('ask');
  if (ask) ask.onkeydown = (e) => { if (e.key === 'Enter' && ask.value.trim()) { coach(ask.value.trim()); } };
  const sc = $('scroll'); if (S.chatScroll) { sc.scrollTop = sc.scrollHeight; S.chatScroll = false; } else if (S.pageTop) { sc.scrollTop = 0; S.pageTop = false; }
}

// ---------- Coach (simulated). Words decide: full description → build new; change request → edit; unclear → ask. ----------
function snapshot() { return JSON.parse(JSON.stringify({ plan: S.plan, days: S.days, focus: S.focus, priority: S.priority, length: S.length, absWk: S.absWk, spec: S.spec, focusOver: S.focusOver, likes: S.likes, never: S.never, prefAns: S.prefAns })); }
function restore(s) { Object.assign(S, s); }
function coach(text) {
  ensureEditing();
  S.chatScroll = true;
  S.chat.push({ who: 'ben', text });
  const t = text.toLowerCase();
  const nDays = t.match(/(\d)\s*(day|days)/);
  if (nDays && /plan|week|days/.test(t) && !/swap|change|move/.test(t)) {
    rebuild(text);
  } else if (/swap|change|move|more|less|no legs|lighter|shorter|longer|add|remove|drop|never|like|love/.test(t)) {
    editPlan(text);
  } else {
    S.pendingAsk = text;
    S.chat.push({ who: 'co', text: 'Build a new plan from that, or change this one?' });
    S.chat.push({ who: 'choice' });
    render();
  }
}
function rebuild(text) {
  const before = snapshot();
  const n = +((text || '').match(/(\d)\s*day/)?.[1] ?? S.days.length);
  const pref = { 2: [1, 4], 3: [0, 2, 4], 4: [0, 1, 3, 5], 5: [0, 1, 2, 4, 5], 6: [0, 1, 2, 3, 4, 5], 7: [0, 1, 2, 3, 4, 5, 6] }[n] ?? S.days;
  S.days = pref; S.focusOver = {}; S.plan = build(); S.open = -1;
  S.chat.push({ who: 'co', text: `Rebuilt for ${n} days: ${S.plan.map((d) => WD[d.day] + ' ' + d.focus).join(', ')}.` });
  render(); toast('Plan rebuilt', true, () => { restore(before); S.chat.pop(); render(); });
}
function editPlan(text) {
  const before = snapshot();
  const t = (text || '').toLowerCase();
  let said = '';
  if (/no legs.*(long run|run)|legs.*before.*run/.test(t)) {
    S.plan = build(); said = `Legs aren't the day before ${WD[S.longRunDay]}'s long run.`;
  } else if (/^(never|no more|i like|i love|more of) /.test(t) && Object.keys(PRIOR).some((n) => t.includes(n.toLowerCase()))) {
    // Explicit preference (Ben, 22 Oct): overrides the default and his history straight away.
    const n = Object.keys(PRIOR).filter((x) => t.includes(x.toLowerCase())).sort((x, y) => y.length - x.length)[0];
    const no = /^(never|no more)/.test(t);
    S.never = no ? [...new Set([...S.never, n])] : S.never.filter((x) => x !== n); S.likes = no ? S.likes.filter((x) => x !== n) : [...new Set([...S.likes, n])];
    S.plan = build(); said = no ? `No more ${n.toLowerCase()}; swapped for the next best for that muscle.` : `${n} is picked first whenever ${(Object.entries(EX).find(([, l]) => l.some(([x]) => x === n))?.[0] ?? 'its muscle').toLowerCase()} are trained.`;
  } else if (/more (chest|back|shoulders|arms|legs|core|abs)/.test(t)) {
    const m = t.match(/more (\w+)/)[1]; const M = m === 'abs' ? 'Core' : m[0].toUpperCase() + m.slice(1);
    if (!S.priority.includes(M)) S.priority.push(M);
    S.plan = build(); said = `${M} is a priority now: more sets on its exercises (${GROUPS[M].map((x) => x + ' ' + weeklySets(S.plan)[x]).join(', ')} a week).`;
  } else if (/swap|change/.test(t)) {
    const di = WD.findIndex((d) => t.includes(d.toLowerCase()) || t.includes({ Mon: 'monday', Tue: 'tuesday', Wed: 'wednesday', Thu: 'thursday', Fri: 'friday', Sat: 'saturday', Sun: 'sunday' }[d]));
    const f = Object.keys(DAYS).find((k) => t.includes(k.toLowerCase()));
    const i = S.plan.findIndex((d) => d.day === di);
    if (i >= 0 && f) { S.focusOver = { ...S.focusOver, [i]: f }; S.plan = build(); S.open = i; said = `${WD[di]} is ${f} now. Everything else stays.`; }
    else said = 'Which day, and to what? e.g. "swap Saturday to arms".';
  } else if (/shorter|longer/.test(t)) {
    S.length = Math.max(20, Math.min(150, S.length + (/shorter/.test(t) ? -10 : 10))); S.plan = build(); said = `${S.length} min sessions; ${S.length < 60 ? 'accessories trimmed first' : 'one more accessory a day'}.`;
  } else {
    said = 'Changed only what you asked; the rest stays.';
  }
  S.chat.push({ who: 'co', text: said });
  render(); toast('Plan changed', true, () => { restore(before); S.chat.pop(); render(); });
}

// ---------- Sheets ----------
function openSpecSheet() {
  sheet(`<h2>Make sure to train</h2>${Object.entries(TARGETS).map(([g, ts]) => `<div class="label">${g}</div><div class="chips">${ts.map((t) => `<button class="chip sm" data-spect="${esc(t)}" aria-pressed="${S.spec.includes(t)}">${esc(t)}</button>`).join('')}</div>`).join('')}`);
  document.querySelectorAll('[data-spect]').forEach((b) => b.onclick = () => {
    const t = b.dataset.spect;
    if (S.spec.includes(t)) S.spec = S.spec.filter((x) => x !== t); else if (S.spec.length >= 4) { toast('Up to 4', false); return; } else S.spec = [...S.spec, t];
    b.setAttribute('aria-pressed', S.spec.includes(t)); if (S.page === 'goals') { if (answered('pri')) answer('pri'); render(); }
  });
}
function sheet(html) { $('sheet').innerHTML = `<div style="display:flex;justify-content:flex-end;margin:-6px -4px -10px"><button class="link" id="sheetClose">Done</button></div>` + html; $('sheetClose').onclick = closeSheet; $('sheet').classList.add('on'); $('scrim').classList.add('on'); }
function closeSheet() { $('sheet').classList.remove('on'); $('scrim').classList.remove('on'); }
// Confirm: title and buttons only (V4).
function confirmSheet(title, ok, fn) { clearTimeout(toastTimer); $('toast').classList.remove('on'); $('sheet').innerHTML = `<h2>${esc(title)}</h2><button class="primary" id="cfOk">${esc(ok)}</button><button class="link" id="cfCancel" style="align-self:center">Cancel</button>`; $('cfOk').onclick = () => { closeSheet(); fn(); }; $('cfCancel').onclick = closeSheet; $('sheet').classList.add('on'); $('scrim').classList.add('on'); }
$('scrim').onclick = closeSheet;
// Swap day (Ben, 22 Oct; replaces Change focus, which could make two days the same): this day trades places with another
// plan day, so the week keeps the same sessions. Days already done aren't offered.
function openFocusSheet(i) {
  const p = S.plan, name = (d, k) => `${S.schedule === 'flexible' ? k + 1 : WD[d.day]} · ${d.focus}${d.variant ? ' ' + d.variant : ''}`;
  sheet(`<h2>Swap ${esc(name(p[i], i))} with</h2><div class="card" style="padding:2px 14px">${p.map((d, k) => k === i || isDoneDay(S.week, k) ? '' : `<button class="row" data-swapwith="${k}" style="display:flex;justify-content:space-between;width:100%;min-height:48px;background:none;border:0;border-bottom:1px solid var(--divider);color:var(--text);font:16px var(--ui);cursor:pointer;text-align:left">${esc(name(d, k))}<span style="color:var(--text3)">⇄</span></button>`).join('')}</div>`);
  document.querySelectorAll('[data-swapwith]').forEach((b) => b.onclick = () => {
    ensureEditing(); const before = snapshot(), k = +b.dataset.swapwith, a = p[i].focus, c = p[k].focus;
    S.focusOver = { ...S.focusOver, [i]: c, [k]: a }; S.plan = build(); closeSheet(); render();
    toast(`Swapped ${a} and ${c}`, true, () => { restore(before); render(); });
  });
}
function openMoveSheet(i) {
  const used = S.plan.map((d) => d.day);
  sheet(`<h2>Move ${esc(S.plan[i].focus)}</h2><div class="week daypick">${WD.map((d, k) => `<button class="day" data-to="${k}" aria-pressed="${S.plan[i].day === k}" ${used.includes(k) && k !== S.plan[i].day ? 'disabled style="opacity:.35"' : ''}><span class="dn">${d}</span></button>`).join('')}</div>`);
  document.querySelectorAll('[data-to]').forEach((b) => b.onclick = () => { if (b.disabled) return; const before = snapshot(); const to = +b.dataset.to; S.plan[i].day = to; S.days = S.plan.map((d) => d.day); S.plan.sort((a, c) => a.day - c.day); closeSheet(); S.open = S.plan.findIndex((d) => d.day === to); render(); toast(`Moved to ${WD[to]}`, true, () => { restore(before); render(); }); });
}
function openTargetSheet(lift) {
  let l = lift ?? MAIN.find((x) => !S.targets.find((t) => t.lift === x)) ?? MAIN[0];
  let kg = S.targets.find((t) => t.lift === l)?.kg ?? snap(projected('Standard', l) + 5);
  const draw = () => {
    sheet(`<h2>Lift target</h2><div class="chips">${MAIN.map((x) => `<button class="chip sm" data-t="${x}" aria-pressed="${x === l}">${SHORT[x]}</button>`).join('')}</div>
      <div class="card"><div class="row"><span>Now ${HIST[l].kg} × ${HIST[l].reps}</span><span class="stepper"><button id="kDown" aria-label="Lighter">−</button><span>${kg} kg</span><button id="kUp" aria-label="Heavier">＋</button></span></div></div>
      <div class="note">${esc(S.effort)}: ${whenReached(l, kg, S.effort) ?? 'over a year'} (est.)</div>
      <button class="primary" id="saveT">Save</button>`);
    document.querySelectorAll('[data-t]').forEach((b) => b.onclick = () => { l = b.dataset.t; kg = S.targets.find((t) => t.lift === l)?.kg ?? snap(projected('Standard', l) + 5); draw(); });
    $('kDown').onclick = () => { kg = Math.max(HIST[l].kg, kg - 2.5); draw(); };
    $('kUp').onclick = () => { kg += 2.5; draw(); };
    $('saveT').onclick = () => { const t = S.targets.find((x) => x.lift === l); if (t) t.kg = kg; else S.targets.push({ lift: l, kg, by: null }); closeSheet(); render(); };
  };
  draw();
}

// ---------- Toast ----------
let toastTimer = null, undoFn = null;
function toast(text, canUndo, fn) {
  $('toastText').textContent = text; $('undo').style.display = canUndo ? '' : 'none'; undoFn = fn || null;
  $('toast').classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.remove('on'), 4000);
}
$('undo').onclick = () => { $('toast').classList.remove('on'); if (undoFn) undoFn(); };

// ---------- Header + controls ----------
$('back').onclick = () => go(-1);
$('close').onclick = () => toast('Closes without changing your plan', false);
function setAi(on) { S.ai = on; $('aiOn').setAttribute('aria-pressed', on); $('aiOff').setAttribute('aria-pressed', !on); if (S.page === 'plan' && !on) S.chat = []; render(); }
$('aiOn').onclick = () => setAi(true);
$('aiOff').onclick = () => setAi(false);
$('restart').onclick = () => { Object.assign(S, { ans: {}, flagged: false, spec: [], focusOver: {}, prefAns: {}, prefFlag: false, likes: [], never: [], priAsk: null, actAsk: null, runs: false, acts: {}, pri: [], page: 'check', priority: [], check: {}, checkSeen: false, plan: null, applied: false, editing: false, chat: [], open: -1 }); render(); };
$('editExisting').onclick = () => { S.ans = { wk: true, eff: true, focus: true }; S.priAsk = S.priAsk ?? 'No'; S.actAsk = S.actAsk ?? 'No'; S.basePlan = null; S.plan = build(); S.basePlan = JSON.parse(JSON.stringify(S.plan)); S.page = 'plan'; S.applied = false; S.editing = true; S.chat = []; S.open = -1; render(); };
render();
</script>
