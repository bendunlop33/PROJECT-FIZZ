<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan Builder Prototype</title>
<style>
/* Plan builder (draft spec docs/design/plan-builder.md, 22 Oct 2026). Example data only, never Ben's real history.
   Flow: Goals → Week → Your plan (proposal, edit by tap or coach chat) → Apply (Undo). Direction D tokens, single dark. */
:root {
  --canvas: #0D0C0B; --surface: #181615; --raised: #23201E; --divider: #302C29;
  --text: #F3EEE8; --text2: #B5ADA5; --text3: #948C84; --accent: #EDE5DA; --on-accent: #0D0C0B;
  --done: #5CC98A; --run: #7FB2E5; --run-sub: #172636; --warn: #F2B84B; --page: #0D0C0B;
  --ui: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--text); font-family: var(--ui); margin: 0; }
.wrap { padding: 16px 12px 40px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.ctrl { width: 390px; max-width: 100%; display: flex; flex-direction: column; gap: 6px; }
.lab { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--text3); }
.hint { color: var(--text2); font-size: 13px; text-align: center; max-width: 390px; line-height: 1.45; }
.phone { position: relative; width: 390px; max-width: 100%; height: min(820px, 100vh); height: min(820px, 100dvh); background: var(--canvas); border: 1px solid var(--divider); border-radius: 40px; padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.status { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; padding: 0 6px; }
.scroll { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 8px; }
.hdr { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 44px; }
h1 { font-size: 26px; font-weight: 600; margin: 0; }
.steps { color: var(--text3); font-size: 13px; font-variant-numeric: tabular-nums; }
.label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--text2); margin-top: 4px; }
.card { background: var(--surface); border-radius: 20px; padding: 6px 16px; display: flex; flex-direction: column; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 52px; border-bottom: 1px solid var(--divider); font-size: 16px; }
.row:last-child { border-bottom: 0; }
.row .v { color: var(--text2); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--divider); background: var(--surface); color: var(--text2); font: 600 15px var(--ui); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.seg { display: grid; gap: 4px; }
.seg .chip { padding: 0 5px; min-width: 0; white-space: nowrap; overflow: hidden; border-radius: 12px; font-size: 14px; }
.chip.sm { min-height: 36px; font-size: 14px; padding: 0 12px; }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--raised); color: var(--text); font-size: 20px; cursor: pointer; }
.stepper span { min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
.link { background: none; border: 0; color: var(--text); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--text3); font-size: 15px; cursor: pointer; padding: 0 4px; min-height: 44px; }
.link.dim { color: var(--text2); }
.primary { min-height: 52px; border-radius: 999px; border: 0; background: var(--accent); color: var(--on-accent); font: 600 17px var(--ui); cursor: pointer; width: 100%; }
.footer { display: flex; flex-direction: column; gap: 6px; }
.askrow { display: flex; gap: 8px; }
.askbar { flex: 1; display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 14px; border-radius: 16px; border: 1.5px solid var(--divider); background: var(--surface); color: var(--text); font: 16px var(--ui); }
.askbar input { flex: 1; background: none; border: 0; color: var(--text); font: 16px var(--ui); outline: none; min-width: 0; }
.mic { width: 48px; height: 48px; border-radius: 16px; border: 1.5px solid var(--divider); background: var(--surface); color: var(--text); cursor: pointer; }
.target { display: flex; align-items: center; justify-content: space-between; min-height: 52px; border-bottom: 1px solid var(--divider); font-size: 16px; gap: 8px; }
.target:last-child { border-bottom: 0; }
.target .x { color: var(--text3); background: none; border: 0; font-size: 18px; min-width: 44px; min-height: 44px; cursor: pointer; }
/* week strip */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.day { background: var(--surface); border: 0; border-radius: 12px; padding: 6px 1px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text); cursor: pointer; font-family: var(--ui); min-height: 64px; }
.day .dn { font-size: 11px; color: var(--text2); letter-spacing: .06em; }
.pip { font-size: 10px; line-height: 1.2; padding: 3px 1px; border-radius: 6px; width: 100%; text-align: center; white-space: nowrap; overflow: hidden; }
.pip.lift { background: rgba(237,229,218,.12); color: var(--text); }
.pip.run { background: var(--run-sub); color: var(--run); }
.pip.rest { color: var(--text3); }
.day.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
.daypick .day { min-height: 52px; justify-content: center; font-size: 13px; font-weight: 600; }
.daypick .day[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.daypick .day[aria-pressed="true"] .dn { color: var(--on-accent); }
.daypick .day.runday { box-shadow: inset 0 0 0 1.5px var(--run); }
/* plan */
.blk { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--text2); }
.dcard { background: var(--surface); border-radius: 18px; padding: 4px 14px; }
.dtop { display: flex; justify-content: space-between; align-items: center; min-height: 56px; cursor: pointer; gap: 8px; }
.dtop .nm { font-size: 17px; font-weight: 600; }
.dtop .sub { font-size: 13px; color: var(--text2); }
.dtop .rt { display: flex; align-items: center; gap: 6px; color: var(--text2); font-size: 13px; font-variant-numeric: tabular-nums; }
.chev { color: var(--text3); font-size: 18px; transition: transform .15s; }
.open .chev { transform: rotate(90deg); }
.ex { display: none; border-top: 1px solid var(--divider); padding: 4px 0 8px; }
.open .ex { display: block; }
.exr { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 0; border-bottom: 1px solid var(--divider); font-size: 15px; }
.exr:last-of-type { border-bottom: 0; }
.exr .w { color: var(--text2); font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; }
.exr .m { color: var(--text3); font-size: 12px; }
.exr.main .n { font-weight: 600; }
.dact { display: flex; gap: 4px; flex-wrap: wrap; }
.vol { display: grid; grid-template-columns: 92px 1fr 52px; align-items: center; gap: 8px; min-height: 30px; font-size: 14px; }
.bar { position: relative; height: 8px; background: var(--raised); border-radius: 4px; }
.bar .rng { position: absolute; top: 0; bottom: 0; background: rgba(237,229,218,.16); border-radius: 4px; }
.bar .fill { position: absolute; top: 2px; height: 4px; left: 0; background: var(--accent); border-radius: 2px; }
.vol .n { text-align: right; color: var(--text2); font-variant-numeric: tabular-nums; }
.vol.pri .mn::after { content: " ★"; color: var(--warn); font-size: 11px; }
.note { font-size: 13px; color: var(--text2); display: flex; gap: 6px; align-items: center; }
.why { background: var(--raised); border-radius: 14px; padding: 10px 12px; font-size: 14px; color: var(--text2); line-height: 1.45; display: none; }
.why.on { display: block; }
.chat { display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 85%; padding: 8px 12px; border-radius: 16px; font-size: 15px; line-height: 1.4; }
.msg.ben { align-self: flex-end; background: var(--raised); }
.msg.co { align-self: flex-start; color: var(--text); padding-left: 0; }
.msg.co b { color: var(--text2); font-weight: 500; font-size: 12px; display: block; }
.choice { display: flex; gap: 8px; }
.choice button { flex: 1; min-height: 44px; border-radius: 12px; border: 1.5px solid var(--divider); background: var(--surface); color: var(--text); font: 600 15px var(--ui); cursor: pointer; }
/* sheet + toast */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.5); display: none; z-index: 20; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 24px 24px 0 0; padding: 14px 16px 24px; z-index: 21; display: none; flex-direction: column; gap: 10px; }
.sheet.on, .scrim.on { display: flex; }
.sheet h2 { font-size: 18px; margin: 0; }
.toast { position: absolute; left: 14px; right: 14px; bottom: 84px; background: var(--raised); border: 1px solid var(--divider); border-radius: 14px; padding: 4px 6px 4px 14px; font-size: 15px; z-index: 30; display: none; justify-content: space-between; align-items: center; }
.toast.on { display: flex; }
.badge { font-size: 12px; color: var(--text3); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 420px) {
  .wrap { padding: 12px 0 40px; }
  .ctrl, .hint { padding: 0 12px; }
  .phone { border-radius: 0; border-left: 0; border-right: 0; height: 100vh; height: 100dvh; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="ctrl">
    <span class="lab">Prototype controls</span>
    <div class="chips">
      <button class="chip sm" id="aiOn" aria-pressed="true">Coach on</button>
      <button class="chip sm" id="aiOff" aria-pressed="false">Offline</button>
      <button class="chip sm" id="restart" aria-pressed="false">Start again</button>
      <button class="chip sm" id="editExisting" aria-pressed="false">Edit existing plan</button>
    </div>
  </div>
  <p class="hint">Opens from Today "Set up a plan ›", Library › Your plan, Profile › Goal and the coach. Example data only. Try the coach: "make it 3 days", "no legs before my long run", "more chest", "swap Saturday to arms".</p>

  <div class="phone" id="phone">
    <div class="status"><span>9:41</span><span>●●● 100%</span></div>
    <div class="hdr">
      <button class="link dim" id="back" aria-label="Back">‹ Back</button>
      <span class="steps" id="steps">1 of 4</span>
      <button class="link dim" id="close">Close</button>
    </div>
    <div class="scroll" id="scroll"></div>
    <div class="footer" id="footer"></div>

    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet"></div>
    <div class="toast" id="toast"><span id="toastText"></span><button class="link" id="undo">Undo</button></div>
  </div>
</div>

<script>
// ---------- Example history (made up) ----------
const HIST = {
  'Bench press': { kg: 97.5, reps: 6, last: 'top 97.5 × 6', date: '12 Oct' },
  'Barbell row': { kg: 90, reps: 12, last: '90 × 12', date: '18 Oct' },
  'Back squat': { kg: 120, reps: 5, last: 'top 120 × 5', date: '3 Aug', stale: true },
  'Romanian deadlift': { kg: 100, reps: 8, last: '100 × 8' },
  'Overhead press': { kg: 55, reps: 6, last: '55 × 6', date: '2 Jun', stale: true },
  'DB shoulder press': { kg: 24, each: true, reps: 8, last: '24 each × 8', date: '15 Oct' },
  'Machine shoulder press': { kg: 50, reps: 10, date: '2 Oct' },
  'Deadlift': { kg: 150, reps: 5, none: true },
  'Front squat': { kg: 100, reps: 5, none: true },
  'Incline bench press': { kg: 80, reps: 8, none: true },
  'Incline DB press': { kg: 30, reps: 10, last: '30 each × 10' },
  'Lat pulldown': { kg: 70, reps: 10, last: '70 × 10' },
  'Leg press': { kg: 200, reps: 10, last: '200 × 10' },
  'Shrugs': { kg: 30, reps: 15, last: '30 each × 15' },
  'Cable fly': { kg: 20, reps: 12, last: '20 × 12' },
  'Lateral raise': { kg: 10, reps: 15, last: '10 each × 15' },
  'Triceps pushdown': { kg: 35, reps: 12, last: '35 × 12' },
  'Hammer curl': { kg: 16, reps: 12, last: '16 each × 12' },
  'Leg curl': { kg: 50, reps: 12, last: '50 × 12' },
  'Calf raise': { kg: 80, reps: 15, last: '80 × 15' },
  'Pull-up': { kg: 0, reps: 8, last: 'BW × 8' },
  'Face pull': { kg: 25, reps: 15, last: '25 × 15' },
  'Barbell curl': { kg: 35, reps: 10, last: '35 × 10' },
  'Cable crunch': { kg: 40, reps: 15, last: '40 × 15' },
  'Hanging leg raise': { kg: 0, reps: 12, last: 'BW × 12' },
};
// Day templates: [exercise, muscle, role]
const DAYS = {
  Push:  { main: 'Bench press', ex: [['Bench press','Chest','main'],['DB shoulder press','Shoulders','c'],['Incline DB press','Chest','c'],['Cable fly','Chest','i'],['Lateral raise','Shoulders','i'],['Triceps pushdown','Triceps','i']] },
  Pull:  { main: 'Barbell row', ex: [['Barbell row','Back','main'],['Lat pulldown','Back','c'],['Face pull','Shoulders','i'],['Shrugs','Back','i'],['Hammer curl','Biceps','i'],['Hanging leg raise','Core','i']] },
  Legs:  { main: 'Back squat', ex: [['Back squat','Quads','main'],['Romanian deadlift','Hamstrings','c'],['Leg press','Quads','c'],['Leg curl','Hamstrings','i'],['Calf raise','Calves','i'],['Cable crunch','Core','i']] },
  Upper: { main: 'DB shoulder press', ex: [['DB shoulder press','Shoulders','main'],['Pull-up','Back','c'],['Incline DB press','Chest','c'],['Lat pulldown','Back','c'],['Lateral raise','Shoulders','i'],['Barbell curl','Biceps','i']] },
  Lower: { main: 'Romanian deadlift', ex: [['Romanian deadlift','Hamstrings','main'],['Leg press','Quads','c'],['Leg curl','Hamstrings','i'],['Calf raise','Calves','i'],['Cable crunch','Core','i']] },
  'Full body': { main: 'Back squat', ex: [['Back squat','Quads','main'],['Bench press','Chest','c'],['Barbell row','Back','c'],['Lateral raise','Shoulders','i'],['Hammer curl','Biceps','i']] },
  Arms:  { main: null, ex: [['Barbell curl','Biceps','i'],['Triceps pushdown','Triceps','i'],['Hammer curl','Biceps','i'],['Lateral raise','Shoulders','i']] },
};
const MUSCLES = ['Chest','Back','Shoulders','Quads','Hamstrings','Calves','Biceps','Triceps','Core'];
// Priority is chosen by group (Ben, 22 Oct); sets are still counted per muscle.
const GROUPS = { Chest: ['Chest'], Back: ['Back'], Shoulders: ['Shoulders'], Legs: ['Quads','Hamstrings','Calves'], Arms: ['Biceps','Triceps'], Core: ['Core'] };
// The coach's priority pick (code computes the facts from the last 8 weeks; offline, code picks the same). Example data.
const SUG = { group: 'Back', why: 'Fewest sets lately (8 a week vs Chest 15) and your row has stalled for 5 weeks.' };
const isPri = (m) => S.priority.some((g) => GROUPS[g].includes(m));
const WD = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
// Other training (Ben, 22 Oct). legs: hard on the legs, so no heavy leg day the day before (GA11).
const ACTS = ['Running', 'Cycling', 'Swimming', 'Boxing', 'Football', 'HIIT', 'Climbing', 'Yoga'];
const ACT_SHORT = { Running: 'Run', Cycling: 'Ride', Swimming: 'Swim', Boxing: 'Box', Football: 'Football', HIIT: 'HIIT', Climbing: 'Climb', Yoga: 'Yoga' };
const ACT_LEGS = new Set(['Cycling', 'Football', 'HIIT']);
const ACT_DEFAULT_DAY = { Cycling: 5, Swimming: 2, Boxing: 3, Football: 6, HIIT: 4, Climbing: 3, Yoga: 6 };

// ---------- State ----------
const S = {
  ai: true, page: 'check', check: {}, focus: 'Balanced', targets: [],
  acts: {}, pri: [], priority: ['Back'], runs: true, longRunDay: 6, runDays: [2, 6],
  days: [0, 1, 3, 5], freq: 4, schedule: 'fixed', weeks: 6, effort: 'Standard', length: 60, gym: 'PureGym Leeds',
  plan: null, open: -1, chat: [], applied: false, editing: false,
};
let undoStack = [];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const snap = (kg, step = 2.5) => Math.floor(kg / step) * step;

// ---------- Deterministic plan (the offline code path; the coach may adjust it) ----------
function splitFor(n, focus) {
  if (n <= 2) return ['Full body', 'Full body'].slice(0, n);
  if (n === 3) return focus === 'Strength' ? ['Full body', 'Full body', 'Full body'] : ['Push', 'Pull', 'Legs'];
  if (n === 4) return focus === 'Strength' ? ['Upper', 'Lower', 'Upper', 'Lower'] : ['Push', 'Pull', 'Legs', 'Upper'];
  if (n === 5) return ['Push', 'Pull', 'Legs', 'Upper', 'Lower'];
  return ['Push', 'Pull', 'Legs', 'Push', 'Pull', 'Legs'];
}
function build() {
  const days = [...S.days].sort((a, b) => a - b);
  const names = splitFor(days.length, S.focus);
  let plan = days.map((d, i) => ({ day: d, focus: names[i] }));
  // No heavy legs the day before the long run: swap with the furthest non-leg day (rule 11/GA15).
  // No heavy legs the day before a long run or a leg-heavy session (cycling, football, HIIT).
  const hard = [...(S.runs ? (S.pri.includes('Running') ? S.runDays : [S.longRunDay]) : []), ...Object.keys(S.acts).filter((x) => ACT_LEGS.has(x) || S.pri.includes(x)).flatMap((x) => S.acts[x])];
  const LEGGY = ['Legs', 'Lower', 'Full body'];
  const blocked = new Set(hard.map((d) => (d + 6) % 7));
  for (const before of blocked) {
    const legs = plan.find((p) => p.day === before && LEGGY.includes(p.focus));
    const other = plan.find((p) => !blocked.has(p.day) && !LEGGY.includes(p.focus));
    if (legs && other) { const f = legs.focus; legs.focus = other.focus; other.focus = f; legs.moved = true; }
  }
  return balance(plan.map((p) => ({ ...p, ex: exercisesFor(p.focus) })));
}
// Nudge sets per exercise (2–5, never the main lift's scheme) until each muscle trained this week sits in its range.
function balance(plan) {
  for (let pass = 0; pass < 12; pass++) {
    const ws = weeklySets(plan); let moved = false;
    for (const m of MUSCLES) {
      const [lo, hi] = range(m); const exs = plan.flatMap((d) => d.ex).filter((e) => e.m === m && e.role !== 'main');
      if (ws[m] < lo) { const e = exs.find((x) => x.sets < 5); if (e) { e.sets += 1; moved = true; } }
      else if (ws[m] > hi) { const e = exs.find((x) => x.sets > 2); if (e) { e.sets -= 1; moved = true; } }
    }
    if (!moved) break;
  }
  plan.forEach((d) => d.ex.forEach((e) => { if (e.role !== 'main') e.line = e.line.replace(/^\d+ ×/, `${e.sets} ×`); }));
  return plan;
}
function exercisesFor(focus) {
  const t = DAYS[focus];
  const cap = S.length <= 45 ? 4 : S.length <= 60 ? 6 : 7;
  const ex = [...t.ex].sort((a, b) => (a[2] === 'main' ? -2 : isPri(a[1]) ? -1 : 0) - (b[2] === 'main' ? -2 : isPri(b[1]) ? -1 : 0));
  return ex.slice(0, cap).map(([n, m, role]) => {
    const h = HIST[n];
    const pri = isPri(m);
    if (role === 'main') {
      const step = h.each ? 2 : 2.5, top = snapFor(n, h.kg + step), back = snapFor(n, top * 0.9);
      const strength = S.focus === 'Strength';
      const backs = (strength ? 3 : 2) + (S.effort === 'Push' ? 1 : 0) - (S.effort === 'Steady' ? 1 : 0);
      return { n, m, role, sets: backs + 1, line: `Top ${fmtKg(n, top)} × ${strength ? 5 : 6} · ${backs} × ${fmtKg(n, back)} × 8`, why: `Last time ${h.last || fmtKg(n, h.kg) + ' × ' + h.reps} → +${step}` };
    }
    const reps = Math.max(8, Math.min(15, h.reps));
    const sets = pri ? 4 : 3;
    const kg = h.kg === 0 ? 'BW' : (h.reps >= 15 ? snap(h.kg + 2.5) : h.kg);
    return { n, m, role, sets, line: `${sets} × ${kg}${kg === 'BW' ? '' : ' kg'} × ${reps}`, why: `Last time ${h.last}` };
  });
}
function weeklySets(plan) {
  const out = Object.fromEntries(MUSCLES.map((m) => [m, 0]));
  plan.forEach((d) => d.ex.forEach((e) => { out[e.m] += e.sets; }));
  return out;
}
// Effort levels: how hard the plan pushes. Bands are weekly hard sets (V4/GA3), shifted by level. [Proposal]
const EFFORT = {
  Steady:   { pri: [10, 14], oth: [6, 10],  sm: [4, 6],  rpe: '6–8', step: 'Add load when reps top out at RPE ≤ 8', deload: 'Only if needed', pct: 0.006, line: 'Keep progressing with less fatigue. Good alongside runs or a busy spell.' },
  Standard: { pri: [12, 20], oth: [8, 14],  sm: [4, 10], rpe: '7–9', step: 'One step when you hit the plan',          deload: 'Last week',      pct: 0.012, line: 'Steady weekly progress you can keep up block after block.' },
  Push:     { pri: [16, 22], oth: [10, 16], sm: [6, 12], rpe: '8–9.5', step: 'One step every session you hit it',    deload: 'Every 4th week', pct: 0.018, line: 'Faster progress, more sets and harder sets. Needs sleep, food and fewer hard runs.' },
};
const range = (m) => { const e = S.pri.length ? EFFORT.Steady : EFFORT[S.effort]; const small = ['Calves','Biceps','Triceps','Core'].includes(m); if (small) return isPri(m) ? [e.sm[0] + 4, e.sm[1] + 4] : e.sm; return isPri(m) ? e.pri : e.oth; };
const deloadText = () => S.effort === 'Steady' ? 'no set deload' : S.effort === 'Push' ? 'deload every 4th week' : `deload week ${S.weeks}`;
// Estimate only (rule 6): the main target lift's top set after the plan, at the level's typical weekly gain.
// Estimates only (rule 6). Weekly gain = a share of the current top set by level (placeholder until his own trend, history-targets).
const MAIN = ['Bench press', 'Back squat', 'Barbell row', 'DB shoulder press'];
const SHORT = { 'Bench press': 'Bench press', 'Back squat': 'Back squat', 'Barbell row': 'Barbell row', 'DB shoulder press': 'DB shoulder press', 'Overhead press': 'Overhead press', 'Romanian deadlift': 'Romanian deadlift', 'Deadlift': 'Deadlift', 'Front squat': 'Front squat', 'Incline bench press': 'Incline bench press' };
const CARD = { 'Bench press': 'Bench', 'Back squat': 'Squat', 'Barbell row': 'BB row', 'DB shoulder press': 'DB shoulder' };
// Dumbbells are per hand and move in 2 kg steps; bars in 2.5 kg (gym kit decides in the app).
const snapFor = (l, kg) => HIST[l]?.each ? Math.floor(kg / 2) * 2 : snap(kg);
// Table cell: "26 kg", with "each" on a smaller line below for dumbbells (Ben, 22 Oct).
const kgCell = (l, kg) => `<span>${kg} kg</span>${HIST[l]?.each ? '<span style="font-size:11px;color:var(--text3);line-height:1.1">each</span>' : ''}`;
const fmtKg = (l, kg) => HIST[l]?.each ? `${kg} each` : `${kg}`;
// Epley, labelled est.: a set's 1RM, and the weight for 6 reps at the same effort.
const e1rm = (kg, reps) => kg * (1 + reps / 30);
const nearest = (l, kg) => { const st = HIST[l]?.each ? 2 : 2.5; return Math.round(kg / st) * st; };
const at6 = (l, kg, reps) => reps === 6 ? kg : nearest(l, e1rm(kg, reps) / 1.2);
const gainWk = (lift, lvl) => Math.max(0.25, HIST[lift].kg * EFFORT[lvl].pct);
const projected = (lvl, lift = 'Bench press') => nearest(lift, HIST[lift].kg + gainWk(lift, lvl) * S.weeks);
const TODAY = new Date(2026, 9, 22);
function whenReached(lift, kg, lvl) {
  const wks = Math.ceil((kg - HIST[lift].kg) / gainWk(lift, lvl));
  if (wks <= 0) return 'now';
  if (wks > 52) return null;
  const d = new Date(TODAY.getTime() + wks * 7 * 86400000);
  const part = d.getDate() <= 10 ? 'early' : d.getDate() <= 20 ? 'mid' : 'late';
  return `${part}-${d.toLocaleString('en-GB', { month: 'short' })}`;
}

// One font size per row, shrunk until every label fits its equal-width box (min 10px), like the Today strip.
function fitSegs() {
  document.querySelectorAll('.seg').forEach((row) => {
    const bs = [...row.querySelectorAll('.chip')];
    let size = 14;
    const fits = () => bs.every((b) => b.scrollWidth <= b.clientWidth);
    bs.forEach((b) => { b.style.fontSize = size + 'px'; });
    while (!fits() && size > 10) { size -= 0.5; bs.forEach((b) => { b.style.fontSize = size + 'px'; }); }
  });
}
function render() {
  const steps = ['Goals', 'Week', 'Your plan'];
  const f = flow(); const i = f.indexOf(S.page);
  $('steps').textContent = S.applied ? 'Your plan' : `${i + 1} of ${f.length}`;
  $('back').style.visibility = i === 0 || S.applied ? 'hidden' : 'visible';
  requestAnimationFrame(fitSegs);
  ({ goals: renderGoals, check: renderCheck, effort: renderAmbition, week: renderWeek, plan: renderPlan })[S.page]();
}

// Strength balance (Ben, 22 Oct): each main lift's est. 1RM ÷ bench est. 1RM against a rough usual band.
// Rules of thumb only; shown as information and a supporting signal for the priority pick, never a reason alone.
// Usual range of each lift's est. 1RM ÷ bench est. 1RM (crowd-sourced strength standards and coaching rules of thumb;
// shown as information, a supporting signal only). Extra lifts can be added on Check your lifts.
const BAL = {
  'Back squat': [1.2, 1.5], 'Barbell row': [0.7, 1.0], 'DB shoulder press': [0.22, 0.30],
  'Deadlift': [1.5, 1.9], 'Front squat': [0.95, 1.2], 'Romanian deadlift': [1.0, 1.3],
  'Overhead press': [0.6, 0.7], 'Incline bench press': [0.8, 0.9],
};
const EXTRA = ['Deadlift', 'Front squat', 'Romanian deadlift', 'Overhead press', 'Incline bench press'];
const checkLifts = () => [...MAIN, ...(S.extra ?? [])];
const hasData = (l) => !HIST[l].none || S.check[l] === 'entered' || S.check[l] === 'est';
const ratio = (l) => e1rm(HIST[l].kg, HIST[l].reps) / e1rm(HIST['Bench press'].kg, HIST['Bench press'].reps);
const balWord = (l) => { const v = ratio(l), [lo, hi] = BAL[l]; return v < lo ? 'Below' : v > hi ? 'Above' : 'In range'; };
// Bench against the others: each other lift implies a usual bench range (its 1RM ÷ its usual ratio); bench's band is
// the average of those, so bench gets a Below / In range / Above like the rest (Ben, 22 Oct).
function benchRange(lifts) {
  const imp = lifts.map((l) => { const e = e1rm(HIST[l].kg, HIST[l].reps), [lo, hi] = BAL[l]; return [e / hi, e / lo]; });
  const avg = (i) => imp.reduce((t, r) => t + r[i], 0) / imp.length;
  return [avg(0), avg(1)];
}
function benchRow(lifts, row, dot) {
  if (!lifts.length) return '';
  const [lo, hi] = benchRange(lifts), b = e1rm(HIST['Bench press'].kg, HIST['Bench press'].reps);
  const min = lo * 0.6, max = hi * 1.4, pos = (x) => Math.max(0, Math.min(100, (x - min) / (max - min) * 100));
  const word = b < lo ? 'Below' : b > hi ? 'Above' : 'In range';
  return row('Bench press', `<span class="rng" style="left:${pos(lo)}%;width:${pos(hi) - pos(lo)}%"></span>${dot(pos(b))}`, word, word === 'Below');
}
function balanceCard() {
  const head = `<div class="label" style="display:flex;align-items:center;gap:4px">Strength balance <button class="link dim" id="balInfo" aria-label="How this is worked out" style="text-decoration:none;font-size:16px;min-width:44px">ⓘ</button></div>`;
  const dot = (p) => `<span style="position:absolute;top:-2px;left:calc(${p}% - 7px);width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)"></span>`;
  const row = (name, bar, word, warn) => `<div class="vol" style="grid-template-columns:132px 1fr 84px;min-height:40px"><span class="mn" style="font-size:14px">${name}</span><span class="bar" style="height:10px">${bar}</span><span class="n" style="font-size:13px;color:${warn ? 'var(--warn)' : 'var(--text2)'}">${word}</span></div>`;
  const lifts = checkLifts().filter((l) => l !== 'Bench press' && BAL[l] && hasData(l));
  const rows = lifts.map((l) => {
    const [lo, hi] = BAL[l]; const v = ratio(l);
    const min = lo * 0.6, max = hi * 1.4, pos = (x) => Math.max(0, Math.min(100, (x - min) / (max - min) * 100));
    const word = balWord(l);
    return row(SHORT[l], `<span class="rng" style="left:${pos(lo)}%;width:${pos(hi) - pos(lo)}%"></span>${dot(pos(v))}`, word, word === 'Below');
  }).join('');
  return `${head}<div class="card" style="padding:10px 16px;gap:6px">
      ${benchRow(lifts, row, dot)}
      ${rows}</div>`;
}
function balanceInfo() {
  const lifts = checkLifts().filter((l) => l !== 'Bench press' && BAL[l] && hasData(l));
  sheet(`<h2>Strength balance</h2>
    <div class="note" style="display:block;line-height:1.45">Each lift's estimated 1RM divided by your bench press estimated 1RM. The shaded band is the usual range for lifters, from crowd-sourced strength standards and coaching rules of thumb. It's not a target: build, technique and how strictly you lift all move it. It only counts toward a priority with another sign, like low sets or a stalled lift.<br><br>Bench press is checked the other way round: the range your other lifts would usually go with.</div>
    <div class="card" style="padding:4px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;column-gap:16px">
      <span class="lab" style="padding:8px 0">Lift</span><span class="lab" style="padding:8px 0;text-align:center">You</span><span class="lab" style="padding:8px 0;text-align:center">Usual</span>
      ${(() => { if (!lifts.length) return ''; const [lo, hi] = benchRange(lifts), b = e1rm(HIST['Bench press'].kg, HIST['Bench press'].reps), r5 = (x) => Math.round(x / 2.5) * 2.5; const c = 'padding:8px 0;border-top:1px solid var(--divider)'; return `<span style="${c}">Bench press</span><span style="${c};text-align:center;font-variant-numeric:tabular-nums">${r5(b)} kg</span><span style="${c};text-align:center;color:var(--text2);font-variant-numeric:tabular-nums">${r5(lo)}–${r5(hi)} kg</span>`; })()}
      ${lifts.map((l) => `<span style="padding:8px 0;border-top:1px solid var(--divider)">${SHORT[l]}</span><span style="padding:8px 0;border-top:1px solid var(--divider);text-align:center;font-variant-numeric:tabular-nums">${(Math.floor(ratio(l) * 100) / 100).toFixed(2)}×</span><span style="padding:8px 0;border-top:1px solid var(--divider);text-align:center;color:var(--text2);font-variant-numeric:tabular-nums">${BAL[l][0]}–${BAL[l][1]}×</span>`).join('')}
    </div>${S.ai ? '' : ''}`);
}

// Read-across (Ben, 22 Oct): a main lift with no history is estimated from his closest similar lift first, then
// from another main lift. Factors are practice-level rules of thumb, always labelled est., replaced by the first session.
const SIMILAR = {
  'DB shoulder press': [
    { from: 'Machine shoulder press', f: (h) => Math.floor(h.kg / 2 / 1.1 / 2) * 2, note: (h) => `${h.kg} × ${h.reps}` },
    { from: 'Overhead press', f: (h) => Math.floor(h.kg / 1.2 / 2 / 2) * 2, note: (h) => `${h.kg} × ${h.reps}` },
    { from: 'Bench press', f: (h) => Math.floor(h.kg * 0.6 / 1.2 / 2 / 2) * 2, note: (h) => `${h.kg} × ${h.reps}` },
  ],
};
const estFrom = (l, i) => { const r = SIMILAR[l]?.[i]; if (!r || !HIST[r.from]) return null; const h = HIST[r.from]; return { kg: r.f(h), reps: h.reps, from: r.from, note: r.note(h), i }; };
const shortName = (l) => SHORT[l] ?? l.replace('DB ', 'DB ').replace('Machine ', 'Machine ');
// Pages: "Check your lifts" only when a main lift has no history or none in 8 weeks.
const needsCheck = () => MAIN.some((l) => HIST[l].none || HIST[l].stale);
const flow = () => [needsCheck() || S.checkSeen ? 'check' : null, 'goals', 'effort', 'week', 'plan'].filter(Boolean);
function go(d) { const f = flow(); const i = Math.max(0, Math.min(f.length - 1, f.indexOf(S.page) + d)); S.page = f[i]; render(); }

function renderCheck() {
  S.checkSeen = true;
  const C = 'display:flex;align-items:center;justify-content:center;min-height:52px;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--divider)';
  const rows = checkLifts().map((l) => {
    const h = HIST[l], c = S.check[l];
    const e = (h.none && c !== 'entered') ? estFrom(l, S.src?.[l] ?? 0) : null;
    const kg = e ? e.kg : h.kg, reps = e ? e.reps : h.reps;
    const six = at6(l, kg, reps), one = nearest(l, e1rm(kg, reps));
    const open = (h.stale && c !== 'yes' && c !== 'entered') || (h.none && !c);
    return `<button data-lift="${l}" style="display:contents;font:inherit;color:inherit;cursor:pointer">
      <span style="${C};justify-content:flex-start;gap:6px;text-align:left">${SHORT[l]}${open ? '<span style="width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none" aria-label="Check"></span>' : ''}</span>
      ${h.none && !e && c !== 'entered' ? `<span style="${C};color:var(--text3)">—</span><span style="${C};color:var(--text3)">—</span>` : `<span style="${C};flex-direction:column;color:${reps === 6 && !e ? 'var(--text)' : 'var(--text2)'}">${kgCell(l, six)}</span>
      <span style="${C};flex-direction:column;color:var(--text2)">${kgCell(l, one)}</span>`}</button>`;
  }).join('');
  $('scroll').innerHTML = `<h1>Check your lifts</h1>
    <div class="card" style="display:grid;grid-template-columns:minmax(0,1fr) 84px 84px;padding:4px 16px">
      <span class="lab" style="display:flex;align-items:center;min-height:32px">Lift</span><span class="lab" style="text-align:center;align-self:center">6 reps</span><span class="lab" style="text-align:center;align-self:center">1RM est.</span>
      ${rows}
      <button class="link" id="addLift" style="grid-column:1 / -1;justify-self:start">＋ Add a lift</button></div>
    <div class="note">Tap a lift to change it. Grey = estimate.</div>
    ${balanceCard()}`;
  if ($('balInfo')) $('balInfo').onclick = balanceInfo;
  if ($('addLift')) $('addLift').onclick = () => {
    const left = EXTRA.filter((l) => !(S.extra ?? []).includes(l));
    sheet(`<h2>Add a lift</h2><div class="card">${left.map((l) => `<button class="row" data-add="${l}" style="background:none;border:0;border-bottom:1px solid var(--divider);color:var(--text);font:inherit;width:100%;cursor:pointer;text-align:left"><span>${SHORT[l]}</span><span class="v">${HIST[l].none ? 'Enter' : '›'}</span></button>`).join('')}</div>`);
    document.querySelectorAll('[data-add]').forEach((b) => b.onclick = () => { const l = b.dataset.add; S.extra = [...(S.extra ?? []), l]; closeSheet(); render(); if (HIST[l].none) openLiftSheet(l); });
  };
  $('footer').innerHTML = `<button class="primary" id="next">Next</button>`;
  document.querySelectorAll('[data-lift]').forEach((b) => b.onclick = () => openLiftSheet(b.dataset.lift));
  $('next').onclick = () => go(1);
}
function openOtherSheet(l) {
  const opts = (SIMILAR[l] ?? []).map((_, i) => estFrom(l, i)).filter(Boolean);
  sheet(`<h2>Estimate ${SHORT[l]} from</h2><div class="card">${opts.map((e) => `<button class="row" data-pick="${e.i}" style="background:none;border:0;border-bottom:1px solid var(--divider);color:var(--text);font:inherit;width:100%;cursor:pointer;text-align:left"><span>${esc(e.from)}<br><span style="font-size:13px;color:var(--text3)">${esc(e.note)}</span></span><span class="v">est. ${e.kg}</span></button>`).join('')}</div>`);
  document.querySelectorAll('[data-pick]').forEach((b) => b.onclick = () => { S.src = { ...(S.src ?? {}), [l]: +b.dataset.pick }; closeSheet(); render(); });
}
function openLiftSheet(l) {
  const h = HIST[l]; const c = S.check[l];
  const e = (h.none && c !== 'entered') ? estFrom(l, S.src?.[l] ?? 0) : null;
  let kg = e ? e.kg : h.kg, reps = e ? e.reps : h.reps;
  const from = c === 'entered' ? 'You entered' : e ? `Estimated from ${e.from} ${e.note}` : h.none ? 'No history. Enter a recent set.' : `Last set: ${fmtKg(l, h.kg)} × ${h.reps} · ${h.date}`;
  const draw = () => {
    sheet(`<h2>${SHORT[l]}</h2><div class="note">${esc(from)}</div>
      <div class="card"><div class="row"><span>Weight</span><span class="stepper"><button id="wD" aria-label="Lighter">−</button><span>${fmtKg(l, kg)}</span><button id="wU" aria-label="Heavier">＋</button></span></div>
      <div class="row"><span>Reps</span><span class="stepper"><button id="rD" aria-label="Fewer">−</button><span>${reps}</span><button id="rU" aria-label="More">＋</button></span></div></div>
      ${h.none && (SIMILAR[l] ?? []).length > 1 ? `<button class="link dim" id="otherL" style="align-self:flex-start">Estimate from another lift</button>` : ''}
      <div class="choice">${h.stale && c !== 'yes' ? `<button id="okL">Still right</button>` : ''}<button id="saveL" style="background:var(--accent);color:var(--on-accent);border-color:var(--accent)">Save</button></div>`);
    const st = h.each ? 2 : 2.5;
    $('wD').onclick = () => { kg = Math.max(0, kg - st); draw(); }; $('wU').onclick = () => { kg += st; draw(); };
    $('rD').onclick = () => { reps = Math.max(1, reps - 1); draw(); }; $('rU').onclick = () => { reps += 1; draw(); };
    if ($('okL')) $('okL').onclick = () => { S.check[l] = 'yes'; closeSheet(); render(); };
    if ($('otherL')) $('otherL').onclick = () => openOtherSheet(l);
    $('saveL').onclick = () => {
      const changed = kg !== (e ? e.kg : h.kg) || reps !== (e ? e.reps : h.reps);
      if (changed || h.none) { Object.assign(HIST[l], { kg, reps, last: `${fmtKg(l, kg)} × ${reps} (you entered)`, none: false, stale: false }); S.check[l] = 'entered'; }
      else S.check[l] = 'yes';
      closeSheet(); render();
    };
  };
  draw();
}

function renderAmbition() {
  const lifts = [...new Set([...S.targets.map((t) => t.lift), ...MAIN])].filter((l) => HIST[l]).slice(0, 4);
  const tgt = (l) => S.targets.find((t) => t.lift === l);
  const fixed = S.targets.find((t) => t.by);
  $('scroll').innerHTML = `
    <h1>Plan length and effort</h1>

    <div class="label" style="display:flex;justify-content:space-between"><span>Effort</span><span>kg · now → week ${S.weeks} (est.)</span></div>
    ${['Steady', 'Standard', 'Push'].map((l) => { const e = EFFORT[l]; return `<button class="card" data-eff="${l}" style="text-align:left;border:${S.effort === l ? '2px solid var(--accent)' : '2px solid transparent'};color:var(--text);cursor:pointer;padding:12px 14px;font:inherit;display:grid;grid-template-columns:minmax(0,1fr);gap:8px">

        <span style="font-size:14px;color:var(--text2);line-height:1.35">${e.line}</span>
        <span style="font-size:12px;color:var(--text3)">RPE ${e.rpe} · ${e.oth[0]}–${e.oth[1]} sets · ${e.deload.toLowerCase()}</span></span>
      <span style="display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;font-size:14px;font-variant-numeric:tabular-nums;justify-items:end;border-top:1px solid var(--divider);padding-top:8px">
        ${lifts.map((lf) => { const t = tgt(lf); const end = projected(l, lf); const hit = t && end >= t.kg; const each = HIST[lf].each ? ' <span style="font-size:11px;color:var(--text3)">each</span>' : ''; return `<span style="color:var(--text2);justify-self:start">${SHORT[lf] ?? lf}</span><span style="color:var(--text3)">${HIST[lf].kg} →</span><span style="font-weight:600;color:${hit ? 'var(--done)' : 'var(--text)'}">${end}${each}</span>`; }).join('')}
      </span>
      ${S.targets.length ? `<span style="grid-column:1 / -1;font-size:13px;color:var(--text2);border-top:1px solid var(--divider);padding-top:6px">${S.targets.map((t) => { const w = whenReached(t.lift, t.kg, l); return `${SHORT[t.lift] ?? t.lift} ${t.kg}: ${w === 'now' ? 'already there' : w ? w + ' (est.)' : 'not within a year'}`; }).join(' · ')}</span>` : ''}</button>`; }).join('')}`;
  $('footer').innerHTML = `<button class="primary" id="next">Next: your week</button>`;
  document.querySelectorAll('[data-rm]').forEach((b) => b.onclick = () => { S.targets.splice(+b.dataset.rm, 1); render(); });
  document.querySelectorAll('[data-wk]').forEach((b) => b.onclick = () => { S.weeks = +b.dataset.wk; S.toDate = !!b.dataset.todate; render(); });
  document.querySelectorAll('[data-eff]').forEach((b) => b.onclick = () => { S.effort = b.dataset.eff; render(); });
  $('next').onclick = () => go(1);
}

function renderWeek() {
  $('scroll').innerHTML = `
    <h1>Your week</h1>
    <div class="card"><div class="row"><span>Sessions a week</span><span class="stepper"><button id="fDown" aria-label="Fewer">−</button><span>${S.freq}</span><button id="fUp" aria-label="More">＋</button></span></div></div>
    <div class="chips"><button class="chip" data-sch="fixed" aria-pressed="${S.schedule === 'fixed'}">Set days</button><button class="chip" data-sch="flexible" aria-pressed="${S.schedule === 'flexible'}">Fit them in</button></div>
    ${S.schedule === 'fixed' ? `<div class="label">Gym days · ${S.days.length} of ${S.freq}</div>
    <div class="week daypick">${WD.map((d, i) => `<button class="day ${S.runs && S.runDays.includes(i) ? 'runday' : ''}" data-day="${i}" aria-pressed="${S.days.includes(i)}"><span class="dn">${d}</span></button>`).join('')}</div>` : `<div class="note">Next session in order whenever you train. No legs the day before a long run.</div>`}
    ${S.runs ? `<div class="label">Runs</div>
    <div class="week daypick">${WD.map((d, i) => `<button class="day" data-run="${i}" aria-pressed="${S.runDays.includes(i)}" style="${S.runDays.includes(i) ? 'background:var(--run-sub);color:var(--run)' : ''}"><span class="dn" style="${S.runDays.includes(i) ? 'color:var(--run)' : ''}">${d}${i === S.longRunDay ? ' ·L' : ''}</span></button>`).join('')}</div>
    <div class="note">Long run: ${WD[S.longRunDay]} <button class="link dim" id="longRun">Change</button></div>` : ''}
    ${Object.keys(S.acts).map((a) => `<div class="label">${esc(a)}</div>
    <div class="week daypick">${WD.map((d, i) => `<button class="day" data-actday="${esc(a)}|${i}" aria-pressed="${S.acts[a].includes(i)}" style="${S.acts[a].includes(i) ? 'background:var(--run-sub);color:var(--run)' : ''}"><span class="dn" style="${S.acts[a].includes(i) ? 'color:var(--run)' : ''}">${d}</span></button>`).join('')}</div>`).join('')}
    <div class="card">
      <div class="row"><span>Length</span><span class="stepper"><button id="lenDown" aria-label="Shorter">−</button><span>${S.length} min</span><button id="lenUp" aria-label="Longer">＋</button></span></div>
      <div class="row"><span>Gym</span><span class="v">${esc(S.gym)} ›</span></div>
    </div>`;
  $('footer').innerHTML = `<button class="primary" id="next">${S.ai ? 'Build my plan' : 'Build my plan'}</button>`;
  document.querySelectorAll('[data-day]').forEach((b) => b.onclick = () => { const d = +b.dataset.day; if (S.days.includes(d)) S.days = S.days.filter((x) => x !== d); else if (S.days.length < S.freq) S.days = [...S.days, d]; else S.days = [...S.days.slice(1), d]; render(); });
  document.querySelectorAll('[data-sch]').forEach((b) => b.onclick = () => { S.schedule = b.dataset.sch; render(); });
  const PREF = { 2: [1, 4], 3: [0, 2, 4], 4: [0, 1, 3, 5], 5: [0, 1, 2, 4, 5], 6: [0, 1, 2, 3, 4, 5] };
  $('fDown').onclick = () => { S.freq = Math.max(2, S.freq - 1); S.days = PREF[S.freq]; render(); };
  $('fUp').onclick = () => { S.freq = Math.min(6, S.freq + 1); S.days = PREF[S.freq]; render(); };
  document.querySelectorAll('[data-actday]').forEach((b) => b.onclick = () => { const [a, d] = b.dataset.actday.split('|'); const n = +d; S.acts[a] = S.acts[a].includes(n) ? S.acts[a].filter((x) => x !== n) : [...S.acts[a], n]; render(); });
  document.querySelectorAll('[data-run]').forEach((b) => b.onclick = () => { const d = +b.dataset.run; S.runDays = S.runDays.includes(d) ? S.runDays.filter((x) => x !== d) : [...S.runDays, d]; if (!S.runDays.includes(S.longRunDay)) S.longRunDay = S.runDays.at(-1) ?? 6; render(); });
  if ($('longRun')) $('longRun').onclick = () => { const i = S.runDays.indexOf(S.longRunDay); S.longRunDay = S.runDays[(i + 1) % S.runDays.length]; render(); };
  $('lenDown').onclick = () => { S.length = Math.max(30, S.length - 15); render(); };
  $('lenUp').onclick = () => { S.length = Math.min(120, S.length + 15); render(); };
  $('next').onclick = () => {
    if (S.schedule === 'fixed' && S.days.length !== S.freq) { toast(`Pick ${S.freq} days`, false); return; }
    if (S.schedule === 'flexible') S.days = { 2: [1, 4], 3: [0, 2, 4], 4: [0, 1, 3, 5], 5: [0, 1, 2, 4, 5], 6: [0, 1, 2, 3, 4, 5] }[S.freq];
    S.plan = build(); S.page = 'plan'; S.chat = []; S.open = -1;
    if (S.ai) S.chat.push({ who: 'co', text: coachIntro() });
    render();
  };
}

function coachIntro() {
  const moved = S.plan.find((p) => p.moved);
  const split = [...new Set(S.plan.map((d) => d.focus))].join(' / ').toLowerCase();
  const chestDays = S.plan.filter((d) => d.ex.some((e) => e.m === 'Chest')).length;
  const ws = weeklySets(S.plan); const short = MUSCLES.filter((m) => ws[m] < range(m)[0]);
  const sport = S.pri.length ? ` Lifting supports ${S.pri.join(' and ')}: lower volume${S.days.length > 3 ? `, and ${S.days.length} lifting days is a lot alongside ${S.pri.length > 1 ? 'them' : 'it'}; 2–3 is usual` : ''}.` : '';
  return `${S.days.length} days, ${split}: chest ${chestDays === 1 ? 'once' : chestDays === 2 ? 'twice' : chestDays + ' times'} a week, bench est. ${projected(S.effort)} by week ${S.weeks}.${moved ? ` Legs moved off ${WD[moved.day]}, the day before a hard leg session.` : ''}${sport}${short.length ? ` ${S.effort} needs more sets than ${S.days.length} × ${S.length} min fits for ${short.slice(0, 3).join(', ').toLowerCase()}${short.length > 3 ? '…' : ''}${S.effort === 'Standard' || S.pri.length ? ': add a day or longer sessions.' : ': add a day, longer sessions, or Standard.'}` : ''}`;
}

function renderPlan() {
  const p = S.plan;
  const ws = weeklySets(p);
  const byDay = Object.fromEntries(p.map((d) => [d.day, d]));
  const strip = WD.map((d, i) => {
    const lift = byDay[i], run = S.runs && S.runDays.includes(i);
    return `<button class="day ${S.open >= 0 && p[S.open]?.day === i ? 'sel' : ''}" data-strip="${i}"><span class="dn">${d}</span>${lift ? `<span class="pip lift">${esc(lift.focus)}</span>` : ''}${run ? `<span class="pip run">${i === S.longRunDay ? 'Long run' : 'Run'}</span>` : ''}${Object.keys(S.acts).filter((a) => S.acts[a].includes(i)).map((a) => `<span class="pip run">${esc(ACT_SHORT[a] ?? a)}</span>`).join('')}${!lift && !run && !Object.keys(S.acts).some((a) => S.acts[a].includes(i)) ? '<span class="pip rest">Rest</span>' : ''}</button>`;
  }).join('');
  $('scroll').innerHTML = `
    <div class="hdr" style="min-height:0"><h1>Your plan</h1>${S.ai ? '' : '<span class="badge">Not reviewed</span>'}</div>
    <div class="blk"><span>${S.weeks} weeks · ${esc(S.effort)} · ${deloadText()}</span><span>${S.length} min</span></div>
    ${S.schedule === 'flexible' ? `<div class="chips">${p.map((d, i) => `<button class="chip sm" data-toggle="${i}" aria-pressed="${S.open === i}">${'ABCDEF'[i]} · ${esc(d.focus)}</button>`).join('')}</div>` : `<div class="week">${strip}</div>`}
    ${p.map((d, i) => `<div class="dcard ${S.open === i ? 'open' : ''}" data-card="${i}">
      <div class="dtop" data-toggle="${i}"><span><div class="nm">${S.schedule === 'flexible' ? 'ABCDEF'[i] : WD[d.day]} · ${esc(d.focus)}</div><div class="sub">${d.ex[0].role === 'main' ? esc(d.ex[0].n) : esc(d.ex.length + ' exercises')}</div></span>
        <span class="rt">${d.ex.length} ex · ~${S.length}′<span class="chev">›</span></span></div>
      <div class="ex">${d.ex.map((e) => `<div class="exr ${e.role === 'main' ? 'main' : ''}"><span class="n">${esc(e.n)}</span><span class="w">${esc(e.line)}</span><span class="m">${esc(e.m)}</span><span class="m" style="text-align:right">${esc(e.why)}</span></div>`).join('')}
        <div class="dact"><button class="link" data-swap="${i}">Change focus</button>${S.schedule === 'fixed' ? `<button class="link" data-move="${i}">Move day</button>` : ''}<button class="link dim" data-open="${i}">Open in builder ›</button></div>
      </div></div>`).join('')}
    <div class="label">Sets per week</div>
    <div class="card" style="padding:10px 16px">${MUSCLES.map((m) => { const [lo, hi] = range(m); const n = ws[m]; const max = 24; return `<div class="vol ${isPri(m) ? 'pri' : ''}"><span class="mn">${m}</span><span class="bar"><span class="rng" style="left:${lo / max * 100}%;width:${(hi - lo) / max * 100}%"></span><span class="fill" style="width:${Math.min(n, max) / max * 100}%"></span></span><span class="n">${n}${n < lo ? ' ↓' : n > hi ? ' ↑' : ''}</span></div>`; }).join('')}
      <div style="display:flex;justify-content:flex-end"><button class="link dim" id="whyBtn">Why?</button></div>
      <div class="why" id="why">Split from ${S.days.length} days and ${esc(S.focus)} focus. Shaded band = target sets for each muscle (priority ★ higher). Weights from your last sessions; each main lift's weekly path aims at its week-${S.weeks} estimate. ${S.runs ? 'No legs the day before the long run.' : ''}</div>
    </div>
    ${S.chat.length ? `<div class="label">Coach</div><div class="chat">${S.chat.map((c) => c.who === 'ben' ? `<div class="msg ben">${esc(c.text)}</div>` : c.who === 'choice' ? `<div class="choice"><button data-choice="new">Build new</button><button data-choice="edit">Change this one</button></div>` : `<div class="msg co"><b>Coach</b>${esc(c.text)}</div>`).join('')}</div>` : ''}`;
  $('footer').innerHTML = `
    <div class="askrow"><label class="askbar">✦<input id="ask" placeholder="${S.ai ? 'Tell the coach…' : 'Coach offline'}" ${S.ai ? '' : 'disabled'} aria-label="Tell the coach"></label><button class="mic" aria-label="Speak" ${S.ai ? '' : 'disabled'}>🎙</button></div>
    ${S.applied ? '' : `<button class="primary" id="apply">${S.editing ? 'Apply changes' : 'Apply plan'}</button>`}`;
  document.querySelectorAll('[data-toggle]').forEach((el) => el.onclick = () => { const i = +el.dataset.toggle; S.open = S.open === i ? -1 : i; render(); });
  document.querySelectorAll('[data-strip]').forEach((el) => el.onclick = () => { const i = p.findIndex((d) => d.day === +el.dataset.strip); S.open = i; render(); });
  document.querySelectorAll('[data-swap]').forEach((el) => el.onclick = () => openFocusSheet(+el.dataset.swap));
  document.querySelectorAll('[data-move]').forEach((el) => el.onclick = () => openMoveSheet(+el.dataset.move));
  document.querySelectorAll('[data-open]').forEach((el) => el.onclick = () => toast('Opens this day in the workout builder', false));
  document.querySelectorAll('[data-choice]').forEach((el) => el.onclick = () => { S.chat = S.chat.filter((c) => c.who !== 'choice'); const pending = S.pendingAsk; S.pendingAsk = null; el.dataset.choice === 'new' ? rebuild(pending) : editPlan(pending); });
  $('whyBtn').onclick = () => $('why').classList.toggle('on');
  if ($('apply')) $('apply').onclick = () => { S.applied = true; S.editing = false; render(); toast('Plan applied', true, () => { S.applied = false; render(); }); };
  const ask = $('ask');
  if (ask) ask.onkeydown = (e) => { if (e.key === 'Enter' && ask.value.trim()) { coach(ask.value.trim()); } };
  const sc = $('scroll'); if (S.chat.length) sc.scrollTop = sc.scrollHeight;
}

// ---------- Coach (simulated). Words decide: full description → build new; change request → edit; unclear → ask. ----------
function snapshot() { return JSON.parse(JSON.stringify({ plan: S.plan, days: S.days, focus: S.focus, priority: S.priority, length: S.length })); }
function restore(s) { Object.assign(S, s); }
function coach(text) {
  S.chat.push({ who: 'ben', text });
  const t = text.toLowerCase();
  const nDays = t.match(/(\d)\s*(day|days)/);
  if (nDays && /plan|week|days/.test(t) && !/swap|change|move/.test(t)) {
    rebuild(text);
  } else if (/swap|change|move|more|less|no legs|lighter|shorter|longer|add|remove|drop/.test(t)) {
    editPlan(text);
  } else {
    S.pendingAsk = text;
    S.chat.push({ who: 'co', text: 'Build a new plan from that, or change this one?' });
    S.chat.push({ who: 'choice' });
    render();
  }
}
function rebuild(text) {
  const before = snapshot();
  const n = +((text || '').match(/(\d)\s*day/)?.[1] ?? S.days.length);
  const pref = { 2: [1, 4], 3: [0, 2, 4], 4: [0, 1, 3, 5], 5: [0, 1, 2, 4, 5], 6: [0, 1, 2, 3, 4, 5] }[n] ?? S.days;
  S.days = pref; S.plan = build(); S.open = -1;
  S.chat.push({ who: 'co', text: `Rebuilt for ${n} days: ${S.plan.map((d) => WD[d.day] + ' ' + d.focus).join(', ')}.` });
  render(); toast('Plan rebuilt', true, () => { restore(before); S.chat.pop(); render(); });
}
function editPlan(text) {
  const before = snapshot();
  const t = (text || '').toLowerCase();
  let said = '';
  if (/no legs.*(long run|run)|legs.*before.*run/.test(t)) {
    S.plan = build(); said = `Legs aren't the day before ${WD[S.longRunDay]}'s long run.`;
  } else if (/more (chest|back|shoulders|arms|legs|core|abs)/.test(t)) {
    const m = t.match(/more (\w+)/)[1]; const M = m === 'abs' ? 'Core' : m[0].toUpperCase() + m.slice(1);
    if (!S.priority.includes(M)) S.priority.push(M);
    S.plan = build(); said = `${M} is a priority now: more sets on its exercises (${GROUPS[M].map((x) => x + ' ' + weeklySets(S.plan)[x]).join(', ')} a week).`;
  } else if (/swap|change/.test(t)) {
    const di = WD.findIndex((d) => t.includes(d.toLowerCase()) || t.includes({ Mon: 'monday', Tue: 'tuesday', Wed: 'wednesday', Thu: 'thursday', Fri: 'friday', Sat: 'saturday', Sun: 'sunday' }[d]));
    const f = Object.keys(DAYS).find((k) => t.includes(k.toLowerCase()));
    const i = S.plan.findIndex((d) => d.day === di);
    if (i >= 0 && f) { S.plan[i] = { ...S.plan[i], focus: f, ex: exercisesFor(f) }; balance(S.plan); S.open = i; said = `${WD[di]} is ${f} now. Everything else stays.`; }
    else said = 'Which day, and to what? e.g. "swap Saturday to arms".';
  } else if (/shorter|longer/.test(t)) {
    S.length = Math.max(30, Math.min(120, S.length + (/shorter/.test(t) ? -15 : 15))); S.plan = build(); said = `${S.length} min sessions; ${S.length < 60 ? 'accessories trimmed first' : 'one more accessory a day'}.`;
  } else {
    said = 'Changed only what you asked; the rest stays.';
  }
  S.chat.push({ who: 'co', text: said });
  render(); toast('Plan changed', true, () => { restore(before); S.chat.pop(); render(); });
}

// ---------- Sheets ----------
function sheet(html) { $('sheet').innerHTML = html; $('sheet').classList.add('on'); $('scrim').classList.add('on'); }
function closeSheet() { $('sheet').classList.remove('on'); $('scrim').classList.remove('on'); }
$('scrim').onclick = closeSheet;
function openFocusSheet(i) {
  sheet(`<h2>${WD[S.plan[i].day]} focus</h2><div class="chips">${Object.keys(DAYS).map((f) => `<button class="chip" data-f="${f}" aria-pressed="${S.plan[i].focus === f}">${f}</button>`).join('')}</div>`);
  document.querySelectorAll('[data-f]').forEach((b) => b.onclick = () => { const before = snapshot(); S.plan[i] = { ...S.plan[i], focus: b.dataset.f, ex: exercisesFor(b.dataset.f) }; balance(S.plan); closeSheet(); render(); toast(`${WD[S.plan[i].day]} is ${b.dataset.f}`, true, () => { restore(before); render(); }); });
}
function openMoveSheet(i) {
  const used = S.plan.map((d) => d.day);
  sheet(`<h2>Move ${esc(S.plan[i].focus)}</h2><div class="week daypick">${WD.map((d, k) => `<button class="day" data-to="${k}" aria-pressed="${S.plan[i].day === k}" ${used.includes(k) && k !== S.plan[i].day ? 'disabled style="opacity:.35"' : ''}><span class="dn">${d}</span></button>`).join('')}</div>`);
  document.querySelectorAll('[data-to]').forEach((b) => b.onclick = () => { if (b.disabled) return; const before = snapshot(); const to = +b.dataset.to; S.plan[i].day = to; S.days = S.plan.map((d) => d.day); S.plan.sort((a, c) => a.day - c.day); closeSheet(); S.open = S.plan.findIndex((d) => d.day === to); render(); toast(`Moved to ${WD[to]}`, true, () => { restore(before); render(); }); });
}
function openTargetSheet(lift) {
  let l = lift ?? MAIN.find((x) => !S.targets.find((t) => t.lift === x)) ?? MAIN[0];
  let kg = S.targets.find((t) => t.lift === l)?.kg ?? snap(projected('Standard', l) + 5);
  const draw = () => {
    sheet(`<h2>Lift target</h2><div class="chips">${MAIN.map((x) => `<button class="chip sm" data-t="${x}" aria-pressed="${x === l}">${SHORT[x]}</button>`).join('')}</div>
      <div class="card"><div class="row"><span>Now ${HIST[l].kg} × ${HIST[l].reps}</span><span class="stepper"><button id="kDown" aria-label="Lighter">−</button><span>${kg} kg</span><button id="kUp" aria-label="Heavier">＋</button></span></div></div>
      <div class="note">${esc(S.effort)}: ${whenReached(l, kg, S.effort) ?? 'over a year'} (est.)</div>
      <button class="primary" id="saveT">Save</button>`);
    document.querySelectorAll('[data-t]').forEach((b) => b.onclick = () => { l = b.dataset.t; kg = S.targets.find((t) => t.lift === l)?.kg ?? snap(projected('Standard', l) + 5); draw(); });
    $('kDown').onclick = () => { kg = Math.max(HIST[l].kg, kg - 2.5); draw(); };
    $('kUp').onclick = () => { kg += 2.5; draw(); };
    $('saveT').onclick = () => { const t = S.targets.find((x) => x.lift === l); if (t) t.kg = kg; else S.targets.push({ lift: l, kg, by: null }); closeSheet(); render(); };
  };
  draw();
}

// ---------- Toast ----------
let toastTimer = null, undoFn = null;
function toast(text, canUndo, fn) {
  $('toastText').textContent = text; $('undo').style.display = canUndo ? '' : 'none'; undoFn = fn || null;
  $('toast').classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.remove('on'), 4000);
}
$('undo').onclick = () => { $('toast').classList.remove('on'); if (undoFn) undoFn(); };

// ---------- Header + controls ----------
$('back').onclick = () => go(-1);
$('close').onclick = () => toast('Closes without changing your plan', false);
function setAi(on) { S.ai = on; $('aiOn').setAttribute('aria-pressed', on); $('aiOff').setAttribute('aria-pressed', !on); if (S.page === 'plan' && !on) S.chat = []; render(); }
$('aiOn').onclick = () => setAi(true);
$('aiOff').onclick = () => setAi(false);
$('restart').onclick = () => { Object.assign(S, { page: 'check', priority: ['Back'], check: {}, checkSeen: false, plan: null, applied: false, editing: false, chat: [], open: -1 }); render(); };
$('editExisting').onclick = () => { S.plan = build(); S.page = 'plan'; S.applied = false; S.editing = true; S.chat = []; S.open = -1; render(); };
render();
</script>
</body>
</html>
