<title>GymSmarter App Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Whole-app prototype (Ben, 22 Oct): one phone with the app's tab bar, built from the existing screen prototypes
   (Today, plan builder, workout builder, active workout, progress, training blocks). Each runs inside the phone in
   embed mode; their main buttons move through the app. Library, Profile and the workout Summary are simple screens
   from their specs (exercise-library.md, profile-and-settings.md, workout-summary.md). Example data only. */
:root {
  --canvas: #0D0C0B; --surface: #181615; --raised: #23201E; --divider: #302C29;
  --text: #F3EEE8; --text2: #B5ADA5; --text3: #948C84; --accent: #EDE5DA; --on-accent: #0D0C0B;
  --done: #5CC98A; --done-sub: #15301F; --warn: #F2B84B; --page: #1B1917;
  --ui: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--text); font-family: var(--ui); margin: 0; }
.wrap { padding: 20px max(16px, env(safe-area-inset-left, 0px)) 32px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.hint { color: var(--text2); font-size: 13px; text-align: center; max-width: 400px; line-height: 1.45; margin: 0; }
.ctrl { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 420px; }
.ctrl button { min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--divider); background: var(--surface); color: var(--text2); font: 600 13px var(--ui); cursor: pointer; }
.phone { width: 390px; max-width: 100%; height: min(844px, 100dvh); background: var(--canvas); border: 1px solid var(--divider); border-radius: 44px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
.top { display: flex; justify-content: space-between; align-items: center; min-height: 44px; padding: 12px 22px 2px; font-size: 13px; font-weight: 600; }
.top .back { background: none; border: 0; color: var(--text); font: 500 15px var(--ui); padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.psub { display: none; gap: 6px; padding: 6px 16px 4px; overflow-x: auto; scrollbar-width: none; }
.psub.on { display: flex; }
.psub button { flex: 1 0 auto; min-height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--divider); background: none; color: var(--text2); font: 600 13px var(--ui); cursor: pointer; }
.psub button.on { background: var(--raised); color: var(--text); border-color: var(--text3); }
.view { flex: 1; position: relative; min-height: 0; }
.view iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: var(--canvas); }
.view iframe.on { display: block; }
.native { position: absolute; inset: 0; overflow-y: auto; padding: 4px 16px 16px; display: none; flex-direction: column; gap: 10px; scrollbar-width: none; }
.native.on { display: flex; }
.native::-webkit-scrollbar { display: none; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--divider); padding: 8px 6px 22px; }
.tabs button { background: none; border: 0; color: var(--text3); font: 600 11px var(--ui); letter-spacing: .1em; padding: 8px 0; cursor: pointer; }
.tabs button.on { color: var(--text); }
h1 { font-size: 28px; font-weight: 600; margin: 4px 0 2px; }
.label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--text2); margin-top: 6px; }
.card { background: var(--surface); border-radius: 18px; padding: 2px 16px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 52px; border-bottom: 1px solid var(--divider); cursor: pointer; }
.row:last-child { border-bottom: 0; }
.row .nm { font-size: 16px; }
.row .sub { font-size: 13px; color: var(--text2); margin-top: 2px; }
.row .chev { color: var(--text3); }
.seg { display: grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: 999px; background: var(--surface); border: 1px solid var(--divider); }
.seg button { min-height: 34px; border: 0; border-radius: 999px; background: none; color: var(--text2); font: 600 14px var(--ui); cursor: pointer; }
.seg button.on { background: var(--raised); color: var(--text); box-shadow: inset 0 0 0 1px var(--text3); }
.search { min-height: 42px; border-radius: 12px; background: var(--surface); border: 1px solid var(--divider); color: var(--text3); display: flex; align-items: center; padding: 0 14px; font-size: 15px; }
.banner { background: var(--done-sub); color: var(--done); border-radius: 14px; padding: 10px 14px; font-size: 15px; font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border-radius: 14px; padding: 10px 12px; }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--text2); }
.tag { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--raised); color: var(--text2); }
.tag.pb { background: var(--done-sub); color: var(--done); }
.link { background: none; border: 0; color: var(--text); font: 500 14px var(--ui); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 0; }
.foot { display: flex; gap: 8px; margin-top: 6px; }
.primary { flex: 1; min-height: 52px; border-radius: 999px; border: 0; background: var(--accent); color: var(--on-accent); font: 600 17px var(--ui); cursor: pointer; }
.secondary { flex: 1; min-height: 52px; border-radius: 999px; border: 1px solid var(--divider); background: none; color: var(--text); font: 600 17px var(--ui); cursor: pointer; }
.ctl { background: var(--raised); border-radius: 14px; }
.mfilter { display: flex; flex-wrap: wrap; gap: 4px; flex-shrink: 0; }
.mfilter button { flex: 1 0 auto; min-height: 32px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--divider); background: none; color: var(--text2); font: 600 13px var(--ui); cursor: pointer; }
.mfilter button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.daypick { display: grid; grid-template-columns: repeat(4, 1fr) 44px; gap: 4px; background: var(--surface); border-radius: 14px; padding: 4px; }
.daypick button { min-height: 46px; border: 0; border-radius: 10px; background: none; color: var(--text3); font: 500 14px var(--ui); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.daypick button.on { background: var(--raised); color: var(--text); font-weight: 600; }
.daypick i { font-style: normal; font-size: 10px; letter-spacing: .08em; color: var(--text3); }
.daypick button.on i { color: var(--accent); }
.cr { display: grid; grid-template-columns: 1fr auto; align-items: center; min-height: 40px; padding: 0 8px 0 12px; }
.cr + .cr { border-top: 1px solid #34302C; }
.cr .k { font-size: 13px; color: var(--text2); white-space: nowrap; }
.kn { font-size: 12px; color: var(--warn); opacity: .8; }
.opts { display: flex; gap: 4px; }
.opts button { min-height: 28px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--divider); background: none; color: var(--text3); font: 600 13px var(--ui); cursor: pointer; }
.opts button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.tv { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.tv button { width: 28px; height: 28px; border-radius: 50%; border: 0; background: var(--surface); color: var(--text); font-size: 16px; cursor: pointer; }
.sw { width: 44px; height: 26px; border-radius: 999px; border: 0; background: #3A3532; position: relative; cursor: pointer; }
.sw i { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--text2); transition: left .15s; }
.sw.on { background: var(--accent); } .sw.on i { left: 21px; background: var(--canvas); }
.toast { position: absolute; left: 16px; right: 16px; bottom: 96px; background: var(--raised); border-radius: 14px; padding: 12px 14px; font-size: 14px; display: none; z-index: 5; }
.toast.on { display: flex; justify-content: space-between; align-items: center; }
.toast.undo { padding: 4px 6px 4px 14px; }
.toast .link { min-height: 40px; padding: 0 8px; font-size: 15px; }
@media (max-width: 440px) {
  .wrap { padding: 0; gap: 0; }
  .hint, .ctrl { display: none; }
  .phone { width: 100%; height: 100dvh; border: 0; border-radius: 0; }
}
</style>
<div class="wrap">
  <div class="ctrl"><button id="reset">Start again</button><button id="withPlan">With a plan</button><button id="noPlan">No plan yet</button></div>
  <p class="hint">The whole app with example data. Today → Set up a plan, Start a workout, or Build your own. Each screen is the latest design prototype.</p>
  <div class="phone" id="phone">
    <div class="top"><span id="topL">9:41</span><span>●●● 100%</span></div>
    <div class="psub" id="psub"></div>
    <div class="view" id="view">
      <section class="native" id="todayNo"></section>
      <section class="native" id="library"></section>
      <section class="native" id="profile"></section>
      <section class="native" id="summary"></section>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="today">TODAY</button><button data-tab="library">LIBRARY</button><button data-tab="progress">PROGRESS</button><button data-tab="profile">PROFILE</button>
    </nav>
    <div class="toast" id="toast"></div>
  </div>
</div>
<script>
// Shared example facts (V1): the same in every screen of the whole-app prototype; build_app.py checks them.
const FIXTURE = {"today": "Tue 20 Oct", "week": "19–25 Oct", "lastWeek": "12–18 Oct", "session": "Chest", "main": "Barbell bench press", "top": 102.5, "back": 92.5, "mainLine": "1 × 6 + 2 × 8 · 102.5 / 92.5", "last": "12 Oct · 100 × 6"};
// Screens: a tab root or a pushed screen. Prototype screens are iframes kept alive, so their state survives switching.
const PAGES = {
  today: () => (A.plan ? 'training-blocks.html' : null), // no plan: the native Today below (workout-builder-v3.md, No plan)
  // One Progress page (Ben, 22 Oct): with a plan it carries the block (header, plan lines); without, the plain v3 page.
  progress: () => (A.plan ? 'training-blocks.html#progress' : 'progress-simple.html'),
  plan: () => 'plan-builder.html',
  planview: () => 'plan-builder.html#view',
  builder: () => 'workout-builder-v3.html',
  // Edit on Today and Open in builder › on the plan (V6): the builder on Your workout with that workout (its own copy).
  draft: () => 'workout-builder-v3.html#draft',
  active: () => 'workout-active-v3.html',
};
const NATIVE = ['todayNo', 'library', 'profile', 'summary'];
const A = { tab: 'today', stack: [], plan: false, ptab: 'overview' };
const $ = (id) => document.getElementById(id);
const frames = {};
function frame(src) {
  if (!frames[src]) { const f = document.createElement('iframe'); f.addEventListener('load', () => { f.dataset.ready = '1'; }); const [file, hash] = src.split('#'); f.src = file + '?embed=1' + (hash ? '#' + hash : ''); f.title = src; $('view').appendChild(f); frames[src] = f; }
  return frames[src];
}
// A toast can offer Undo (V4): undo() puts things back; done() runs once it can no longer be undone (timeout or the next toast).
let pending = null;
function settle() { const p = pending; pending = null; p?.done?.(); }
function toast(t, undo, done) {
  settle();
  const el = $('toast'); el.innerHTML = `<span></span>${undo ? '<button class="link" id="toastUndo">Undo</button>' : ''}`; el.firstChild.textContent = t;
  el.classList.toggle('undo', !!undo); el.classList.add('on'); pending = undo ? { undo, done } : null;
  if (undo) $('toastUndo').onclick = () => { const p = pending; pending = null; clearTimeout(toast.t); el.classList.remove('on'); p?.undo(); };
  clearTimeout(toast.t); toast.t = setTimeout(() => { el.classList.remove('on'); settle(); }, undo ? 4000 : 2200);
}
// Take screens out of the app but keep them (with their state) until Undo is no longer possible.
function stash(keys) {
  const kept = {}; keys.forEach((k) => { if (frames[k]) { kept[k] = frames[k]; kept[k].classList.remove('on'); delete frames[k]; } });
  return {
    // Undo: screens opened since (e.g. the plan overview after Apply) go, the kept ones come back.
    back: () => keys.forEach((k) => { if (frames[k] && frames[k] !== kept[k]) { frames[k].remove(); delete frames[k]; } if (kept[k]) frames[k] = kept[k]; }),
    drop: () => Object.values(kept).forEach((f) => f.remove()),
  };
}
// Leave the current state with Undo: restores the plan flags, where you were, and the stashed screens.
function undoable(msg, keys, change) {
  const prev = { plan: A.plan, paused: A.paused, live: A.live, tab: A.tab, stack: [...A.stack] }, kept = stash(keys);
  change(); show();
  toast(msg, () => { kept.back(); Object.assign(A, prev, { stack: [...prev.stack] }); show(); }, kept.drop);
}
function current() { return A.stack.at(-1) ?? A.tab; }
function show() {
  const cur = current(), pushed = A.stack.length > 0;
  Object.values(frames).forEach((f) => f.classList.remove('on'));
  NATIVE.forEach((n) => $(n).classList.remove('on'));
  const src = PAGES[cur]?.(), nat = src ? null : (cur === 'today' ? 'todayNo' : cur);
  if (src) frame(src).classList.add('on');
  else { $(nat).classList.add('on'); ({ todayNo: renderTodayNo, library: renderLibrary, profile: renderProfile, summary: renderSummary })[nat](); }
  $('tabs').style.display = pushed ? 'none' : '';
  $('psub').classList.remove('on');
  document.querySelectorAll('[data-tab]').forEach((b) => b.classList.toggle('on', b.dataset.tab === A.tab));
  $('topL').innerHTML = pushed && cur !== 'summary' ? `<button class="back" id="backBtn">‹ ${A.tab === 'today' ? 'Today' : A.tab[0].toUpperCase() + A.tab.slice(1)}</button>` : '9:41';
  if ($('backBtn')) $('backBtn').onclick = pop;
}
function push(r) { A.stack.push(r); show(); }
function pop() { A.stack.pop(); show(); }
function home(msg) { A.stack = []; A.tab = 'today'; show(); if (msg) toast(msg); }
document.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => { A.tab = b.dataset.tab; A.stack = []; show(); });

// Buttons inside the screen prototypes send where to go (see build_app.py for which button goes where).
addEventListener('message', (e) => {
  const to = e.data?.app; if (!to) return;
  if (to === 'back') return A.stack.length ? pop() : home();
  if (to === 'applied') return undoable('Plan applied', ['plan-builder.html', 'plan-builder.html#view'], () => { A.plan = true; A.stack = []; A.tab = 'today'; });
  if (to === 'changed') return; // edits apply inside the overview
  if (to === 'dotoday') { A.tab = 'today'; A.stack = []; show(); const f = frame(PAGES.today()); const send = () => f.contentWindow.postMessage({ cmd: 'day', day: e.data.day }, '*'); if (f.dataset.ready) send(); else f.addEventListener('load', () => setTimeout(send, 50), { once: true }); return; }
  if (to === 'planupdate') {
    // Today's Start prompt › Update in your plan: open the plan overview with today's changes as changes to review.
    A.tab = 'library'; A.stack = ['planview']; show();
    const f = frame(PAGES.planview()), send = () => f.contentWindow.postMessage({ cmd: 'edit', change: e.data.change }, '*');
    if (f.dataset.ready) send(); else f.addEventListener('load', () => { f.dataset.ready = '1'; setTimeout(send, 50); }, { once: true });
    return;
  }
  if (to === 'paused' || to === 'resumed') { A.paused = to === 'paused'; return; }
  // End plan is confirmed inside the plan overview first (V4).
  if (to === 'endplan') return undoable('Plan ended', ['plan-builder.html#view'], () => { A.plan = false; A.paused = false; A.stack = []; A.tab = 'library'; });
  if (to === 'builder' && e.data.draft) {
    push('draft');
    const f = frame(PAGES.draft()), send = () => f.contentWindow.postMessage({ cmd: 'draft', draft: e.data.draft }, '*');
    if (f.dataset.ready) send(); else f.addEventListener('load', send, { once: true });
    return;
  }
  if (to === 'active' && e.data.session) return start(e.data.session);
  if (to === 'finished') { A.live = false; A.log = e.data.log ?? null; SUM.undone = {}; A.stack = ['summary']; return show(); }
  // Discard is confirmed inside the workout first (Discard N logged sets?). Undo brings the same workout back (V4).
  if (to === 'discarded') return undoable('Workout discarded', ['workout-active-v3.html'], () => { A.live = false; A.stack = []; A.tab = 'today'; });
  if (to === 'library' || to === 'profile' || to === 'progress') { A.tab = to; A.stack = []; return show(); }
  push(to);
});

// Start: the active workout opens with exactly this session (V1): same name, exercises, order, sets, reps and kg.
// Starting ends a pending Undo (a discarded workout can't come back over a new one). A workout in progress is
// resumed, never replaced: its logged sets stay (rule 2).
function start(session) {
  settle(); clearTimeout(toast.t); $('toast').classList.remove('on');
  if (A.live && frames[PAGES.active()]) { push('active'); if (session.name !== A.session?.name) toast(`${A.session.name} in progress`); return; }
  A.session = session; A.log = null; A.live = true; push('active');
  const f = frame(PAGES.active()), send = () => f.contentWindow.postMessage({ cmd: 'session', session }, '*');
  if (f.dataset.ready) send(); else f.addEventListener('load', send, { once: true });
}
// Main lift in one format everywhere (V1): top set + back-offs · loads, e.g. 1 × 6 + 2 × 8 · 100 / 90.
const EACH = new Set(['Incline dumbbell press', 'Dumbbell shoulder press', 'Lateral raise', 'Rear-delt fly', 'Chest-supported row', 'Hammer curl', 'Single-arm DB row', 'Incline DB curl']);
const snap25 = (v) => Math.round(v / 2.5) * 2.5;
const mainLine = (e) => (e.kg == null ? `${e.sets} × ${e.reps}` : `1 × ${e.reps}${e.sets > 1 ? ` + ${e.sets - 1} × ${e.backReps}` : ''} · ${e.kg}${e.sets > 1 ? ` / ${e.back}` : ''}${EACH.has(e.name ?? e.n) ? ' each' : ''}`);

// ---------- Today with no plan (workout-builder-v3.md §states, No plan) ----------
// No day tabs. One row: No plan · Set up a plan. Up next comes from the old resolver: Profile split, else routines in
// rotation, else the longest gap; here the longest gap (Chest, last trained 12 Oct: the shared fixture's session). Start is one tap.
const STRIP = [['SAT', 17, 'Legs', 'done'], ['SUN', 18, 'Run 12k', 'run'], ['MON', 19, '', ''], ['TODAY', 20, '', 'today'], ['WED', 21, '', ''], ['THU', 22, '', ''], ['FRI', 23, '', '']];
// No plan, Up next still adjustable before Start (Ben, 22 Oct): same controls as Today with a plan, today only, with the
// same fit-to-time (rests, supersets, then the cheapest cut; main lift kept; note after Time in light orange).
// Days come from Profile › Split; the suggested one is marked NEXT. Picking another is today only (the suggestion moves on).
// [label, exercise, kg] for main lifts (kg null = bodyweight); accessories [exercise, kg, compound?] and the extra [exercise, kg],
// as Today with a plan (training-blocks.html D): the same day reads the same with or without a plan (V1).
const TN_DAYS = {
  Back: { mains: [['Row', 'Barbell row', 92.5], ['Pull-up', 'Pull-up', null]], last: 'last Back 14 Oct', focused: [['Lat pulldown', 60, 1], ['Chest-supported row', 22.5, 1]], varied: [['Lat pulldown', 60, 1], ['Seated cable row', 60, 1], ['Face pull', 22.5]], extra: ['EZ-bar curl', 30] },
  Chest: { mains: [['Bench', FIXTURE.main, FIXTURE.top], ['Incline', 'Incline barbell press', 82.5]], last: 'last Chest 12 Oct', focused: [['Incline dumbbell press', 27.5, 1], ['Cable fly', 15]], varied: [['Incline dumbbell press', 27.5, 1], ['Cable crossover', 12.5], ['Dips', null, 1]], extra: ['Triceps pushdown', 30] },
  Legs: { mains: [['Squat', 'Back squat', 117.5], ['Leg press', 'Leg press', 195]], last: 'last Legs 17 Oct', focused: [['Romanian deadlift', 105, 1], ['Leg press', 195, 1]], varied: [['Romanian deadlift', 105, 1], ['Leg press', 180, 1], ['Leg curl', 47.5]], extra: ['Seated calf raise', 40] },
  Shoulders: { mains: [['DB press', 'Dumbbell shoulder press', 32.5], ['Machine', 'Machine shoulder press', 60]], last: 'last Shoulders 16 Oct', focused: [['Lateral raise', 10], ['Rear-delt fly', 7.5]], varied: [['Lateral raise', 10], ['Face pull', 22.5], ['Cable lateral raise', 5]], extra: ['Triceps pushdown', 30] },
};
const TN_NEXT = FIXTURE.session;
const TN = { day: TN_NEXT, main: null, style: 'Focused', min: 60, abs: true, ss: true };
const tnMain = () => TN.main ?? TN_DAYS[TN.day].mains[0][0];
const tnChanged = () => TN.day !== TN_NEXT || tnMain() !== TN_DAYS[TN.day].mains[0][0] || TN.style !== 'Focused' || TN.min !== 60 || !TN.abs || !TN.ss;
// Same session and the same time and fit-to-time as Today with a plan (training-blocks.html draft()), so a day's
// exercises, sets and minutes match with or without a plan (V1). A main lift that is also an accessory isn't repeated.
function tnWorkout() {
  const D = TN_DAYS[TN.day], [, mn, mkg] = D.mains.find(([k]) => k === tnMain()), accSets = TN.style === 'Varied' ? 2 : 3;
  const ex = [{ n: mn, main: true, sets: 3, reps: mkg == null ? 8 : 6, backReps: 8, kg: mkg, back: mkg == null ? null : snap25(mkg * 0.9), comp: 1 },
    ...(TN.style === 'Varied' ? D.varied : D.focused).filter(([n]) => n !== mn).map(([n, kg, c]) => ({ n, sets: accSets, comp: c ? 1 : 0, kg, reps: c ? 8 : 12 })),
    { n: D.extra[0], extra: true, sets: 3, comp: 0, kg: D.extra[1], reps: 12 }, ...(TN.abs ? [{ n: 'Cable crunch', abs: true, sets: 3, kg: 40, reps: 12 }] : [])];
  const pair = (l) => l.some((e) => e.extra) && l.some((e) => e.abs);
  const mins = (l, rest = 1, ss = TN.ss) => 4 + l.reduce((m, e) => m + e.sets * (e.main ? 4 : e.comp ? 3 : 2.2) * rest + 1.5, 0) - (ss && TN.abs && pair(l) ? 5 : 0);
  if (mins(ex) <= TN.min) return { ex, est: Math.round(mins(ex)), note: '', ss: TN.ss };
  const rest = 0.85; let note = 'shorter rests', ssOn = TN.ss;
  if (mins(ex, rest) > TN.min && !TN.ss && TN.abs && mins(ex, rest, true) < mins(ex, rest)) { ssOn = true; note = 'supersets'; }
  const val = (e) => e.abs ? 2.5 : e.extra ? 1.5 : e.comp ? 3 : 2, per = (e) => (e.comp ? 3 : 2.2) * rest;
  const n0 = ex.length, s0 = ex.reduce((a, e) => a + e.sets, 0);
  while (mins(ex, rest, ssOn) > TN.min) {
    const over = mins(ex, rest, ssOn) - TN.min, opts = [];
    ex.forEach((e, k) => { if (e.main) return; if (e.sets > 2) opts.push({ k, drop: false, lost: val(e), saves: per(e) }); if (ex.length > 2) opts.push({ k, drop: true, lost: val(e) * e.sets, saves: per(e) * e.sets + 1.5 }); });
    if (!opts.length) break;
    const o = opts.filter((x) => x.saves >= over).sort((a, b) => a.lost - b.lost)[0] ?? opts.sort((a, b) => a.lost / a.saves - b.lost / b.saves)[0];
    if (o.drop) ex.splice(o.k, 1); else ex[o.k].sets -= 1;
  }
  if (ssOn && !TN.ss && !pair(ex)) { ssOn = false; note = 'shorter rests'; }
  const dropped = n0 - ex.length, cut = s0 - ex.reduce((a, e) => a + e.sets, 0);
  if (dropped) note = `−${dropped} exercise${dropped > 1 ? 's' : ''}`; else if (cut) note = `−${cut} set${cut > 1 ? 's' : ''}`;
  return { ex, est: Math.min(TN.min, Math.round(mins(ex, rest, ssOn))), note, ss: ssOn };
}

function tnSession() {

  let blocks = ex.map((e) => [e]);
  const xi = w.ex.findIndex((e) => e.extra);
  if (w.ss && TN.abs && xi >= 0 && w.ex[xi + 1]?.abs) blocks = [...ex.slice(0, xi).map((e) => [e]), [ex[xi], ex[xi + 1]], ...ex.slice(xi + 2).map((e) => [e])];
  return { name: TN.day, date: FIXTURE.today, min: TN.min, est: w.est, ss: w.ss, lastDate: TN_DAYS[TN.day].last.split(' ').slice(-2).join(' '), blocks };
}

// ---------- Workout summary (workout-summary.md §2) ----------
// The workout that was started and what was logged in it (V1): same name, today's date, its exercises.
const SUM = { undone: {} };
function renderSummary() {
  const ses = A.session ?? { name: 'Workout', blocks: [] }, log = A.log ?? { ex: [], start: Date.now(), end: Date.now() };
  const work = log.ex.flatMap((e) => e.sets), done = work.filter((z) => z.done).length, mins = Math.round((log.end - log.start) / 60000);
  const kgs = (kg, each) => (kg === 'BW' ? 'BW' : `${kg} kg${each ? ' each' : ''}`);
  // Next time (built-in rule shown as before): every set done → one step up; otherwise hold.
  const next = log.ex.map((e) => {
    const sets = e.sets, top = sets.find((z) => z.t === 'Top') ?? sets[0], n = sets.filter((z) => z.done).length;
    if (!top) return null;
    const up = n === sets.length && top.kg !== 'BW', kg = up ? top.kg + 2.5 : top.kg;
    return [e.name, up ? `Target ${kgs(kg, e.each)} × ${top.r}` : `Same: ${kgs(kg, e.each)} × ${top.r}`, up ? `+${Math.round((2.5 / top.kg) * 1000) / 10}%` : '0%', up ? 'All sets done.' : `${n} of ${sets.length} sets logged; holding.`];
  }).filter(Boolean);
  // Main lift's top set against last time (only when it was logged).
  const me = log.ex.find((e) => e.main), mt = me?.sets.find((z) => z.t === 'Top' && z.done), last = ses.blocks.flat().find((x) => x.main)?.last;
  const lm = /^(.*) · ([\d.]+) × (\d+)$/.exec(last ?? ''), pb = mt && lm && (mt.kg > +lm[2] || (mt.kg === +lm[2] && mt.r > +lm[3]));
  $('summary').innerHTML = `<div class="banner">✓ Workout saved on this phone</div>
    <h1>${ses.name}</h1><div style="color:var(--text2);font-size:14px;margin-top:-6px">${FIXTURE.today} · Main gym</div>
    <div class="stats"><div class="stat"><b>${mins < 1 ? '<1' : mins} min</b><span>Active</span></div><div class="stat"><b>${done}</b><span>Sets</span></div><div class="stat"><b>${done}/${work.length}</b><span>Planned</span></div></div>
    ${mt ? `<div class="label">Compared with last time</div>
    <div class="card" style="padding:10px 16px"><div style="display:flex;justify-content:space-between"><span>${me.name} · top set</span>${pb ? '<span class="tag pb">PB</span>' : ''}</div>
      <div style="display:grid;grid-template-columns:1fr auto;gap:4px;margin-top:8px;font-variant-numeric:tabular-nums"><span style="color:var(--text2)">Today</span><b>${kgs(mt.kg, me.each)} × ${mt.r}</b>${lm ? `<span style="color:var(--text2)">${lm[1]}</span><span>${kgs(+lm[2], me.each)} × ${lm[3]}</span>` : ''}</div></div>` : ''}
    <div class="label">Logged</div>
    <div class="card">${log.ex.map((e) => { const d = e.sets.filter((z) => z.done); return `<div class="row" style="cursor:default"><span><div class="nm">${e.name}</div><div class="sub">${d.length ? d.map((z) => `${z.kg === 'BW' ? 'BW' : z.kg} × ${z.r}`).join(', ') : 'Not logged'}${d.length && e.each ? ' · kg each' : ''}</div></span><span class="sub">${d.length}/${e.sets.length}</span></div>`; }).join('') || '<div class="row" style="cursor:default"><span class="sub">Nothing logged</span></div>'}</div>
    ${next.length ? `<div class="label">Next time · ${ses.name}</div>
    <div class="card">${next.map(([n, t, pct, why], i) => `<div class="row" style="cursor:default;align-items:flex-start;padding:10px 0"><span><div class="nm">${n}</div><div class="sub">${SUM.undone[i] ? 'Back to rule: same as today' : `${t} · ${pct}`}</div><div class="sub" style="color:var(--text3)">${why}</div></span>${SUM.undone[i] ? '' : `<button class="link" data-undo="${i}">Undo</button>`}</div>`).join('')}</div>` : ''}
    <div class="foot"><button class="secondary" id="sumEdit">Edit</button><button class="primary" id="sumDone">Done</button></div>`;
  $('summary').querySelectorAll('[data-undo]').forEach((b) => b.onclick = () => { SUM.undone[+b.dataset.undo] = true; renderSummary(); });
  $('sumDone').onclick = () => home();
  $('sumEdit').onclick = () => toast('Edit workout (delete-workouts.md)');
}
