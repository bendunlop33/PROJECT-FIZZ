<title>GymSmarter App Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Whole-app prototype (Ben, 22 Oct): one phone with the app's tab bar, built from the existing screen prototypes
   (Today, plan builder, workout builder, active workout, progress, training blocks). Each runs inside the phone in
   embed mode; their main buttons move through the app. Library, Profile and the workout Summary are simple screens
   from their specs (exercise-library.md, profile-and-settings.md, workout-summary.md). Example data only. */
:root {
  --canvas: #0D0C0B; --surface: #181615; --raised: #23201E; --divider: #302C29;
  --text: #F3EEE8; --text2: #B5ADA5; --text3: #948C84; --accent: #EDE5DA; --on-accent: #0D0C0B;
  --done: #5CC98A; --done-sub: #15301F; --warn: #F2B84B; --page: #1B1917;
  --ui: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--text); font-family: var(--ui); margin: 0; }
.wrap { padding: 20px max(16px, env(safe-area-inset-left, 0px)) 32px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.hint { color: var(--text2); font-size: 13px; text-align: center; max-width: 400px; line-height: 1.45; margin: 0; }
.ctrl { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 420px; }
.ctrl button { min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--divider); background: var(--surface); color: var(--text2); font: 600 13px var(--ui); cursor: pointer; }
.phone { width: 390px; max-width: 100%; height: min(844px, 100dvh); background: var(--canvas); border: 1px solid var(--divider); border-radius: 44px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
.top { display: flex; justify-content: space-between; align-items: center; min-height: 44px; padding: 12px 22px 2px; font-size: 13px; font-weight: 600; }
.top .back { background: none; border: 0; color: var(--text); font: 500 15px var(--ui); padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.psub { display: none; gap: 6px; padding: 6px 16px 4px; overflow-x: auto; scrollbar-width: none; }
.psub.on { display: flex; }
.psub button { flex: 1 0 auto; min-height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--divider); background: none; color: var(--text2); font: 600 13px var(--ui); cursor: pointer; }
.psub button.on { background: var(--raised); color: var(--text); border-color: var(--text3); }
.view { flex: 1; position: relative; min-height: 0; }
.view iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: var(--canvas); }
.view iframe.on { display: block; }
.native { position: absolute; inset: 0; overflow-y: auto; padding: 4px 16px 16px; display: none; flex-direction: column; gap: 10px; scrollbar-width: none; }
.native.on { display: flex; }
.native::-webkit-scrollbar { display: none; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--divider); padding: 8px 6px 22px; }
.tabs button { background: none; border: 0; color: var(--text3); font: 600 11px var(--ui); letter-spacing: .1em; padding: 8px 0; cursor: pointer; }
.tabs button.on { color: var(--text); }
h1 { font-size: 28px; font-weight: 600; margin: 4px 0 2px; }
.label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--text2); margin-top: 6px; }
.card { background: var(--surface); border-radius: 18px; padding: 2px 16px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 52px; border-bottom: 1px solid var(--divider); cursor: pointer; }
.row:last-child { border-bottom: 0; }
.row .nm { font-size: 16px; }
.row .sub { font-size: 13px; color: var(--text2); margin-top: 2px; }
.row .chev { color: var(--text3); }
.seg { display: grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: 999px; background: var(--surface); border: 1px solid var(--divider); }
.seg button { min-height: 34px; border: 0; border-radius: 999px; background: none; color: var(--text2); font: 600 14px var(--ui); cursor: pointer; }
.seg button.on { background: var(--raised); color: var(--text); box-shadow: inset 0 0 0 1px var(--text3); }
.search { min-height: 42px; border-radius: 12px; background: var(--surface); border: 1px solid var(--divider); color: var(--text3); display: flex; align-items: center; padding: 0 14px; font-size: 15px; }
.banner { background: var(--done-sub); color: var(--done); border-radius: 14px; padding: 10px 14px; font-size: 15px; font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border-radius: 14px; padding: 10px 12px; }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--text2); }
.tag { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--raised); color: var(--text2); }
.tag.pb { background: var(--done-sub); color: var(--done); }
.link { background: none; border: 0; color: var(--text); font: 500 14px var(--ui); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 0; }
.foot { display: flex; gap: 8px; margin-top: 6px; }
.primary { flex: 1; min-height: 52px; border-radius: 999px; border: 0; background: var(--accent); color: var(--on-accent); font: 600 17px var(--ui); cursor: pointer; }
.secondary { flex: 1; min-height: 52px; border-radius: 999px; border: 1px solid var(--divider); background: none; color: var(--text); font: 600 17px var(--ui); cursor: pointer; }
.ctl { background: var(--raised); border-radius: 14px; }
.mfilter { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
.mfilter button { flex: 1 0 auto; min-height: 32px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--divider); background: none; color: var(--text2); font: 600 13px var(--ui); cursor: pointer; }
.mfilter button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.daypick { display: grid; grid-template-columns: repeat(4, 1fr) 44px; gap: 4px; background: var(--surface); border-radius: 14px; padding: 4px; }
.daypick button { min-height: 46px; border: 0; border-radius: 10px; background: none; color: var(--text3); font: 500 14px var(--ui); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.daypick button.on { background: var(--raised); color: var(--text); font-weight: 600; }
.daypick i { font-style: normal; font-size: 10px; letter-spacing: .08em; color: var(--text3); }
.daypick button.on i { color: var(--accent); }
.cr { display: grid; grid-template-columns: 1fr auto; align-items: center; min-height: 40px; padding: 0 8px 0 12px; }
.cr + .cr { border-top: 1px solid #34302C; }
.cr .k { font-size: 13px; color: var(--text2); white-space: nowrap; }
.kn { font-size: 12px; color: var(--warn); opacity: .8; }
.opts { display: flex; gap: 4px; }
.opts button { min-height: 28px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--divider); background: none; color: var(--text3); font: 600 13px var(--ui); cursor: pointer; }
.opts button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.tv { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.tv button { width: 28px; height: 28px; border-radius: 50%; border: 0; background: var(--surface); color: var(--text); font-size: 16px; cursor: pointer; }
.sw { width: 44px; height: 26px; border-radius: 999px; border: 0; background: #3A3532; position: relative; cursor: pointer; }
.sw i { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--text2); transition: left .15s; }
.sw.on { background: var(--accent); } .sw.on i { left: 21px; background: var(--canvas); }
.toast { position: absolute; left: 16px; right: 16px; bottom: 96px; background: var(--raised); border-radius: 14px; padding: 12px 14px; font-size: 14px; display: none; z-index: 5; }
.toast.on { display: block; }
@media (max-width: 440px) {
  .wrap { padding: 0; gap: 0; }
  .hint, .ctrl { display: none; }
  .phone { width: 100%; height: 100dvh; border: 0; border-radius: 0; }
}
</style>
<div class="wrap">
  <div class="ctrl"><button id="reset">Start again</button><button id="withPlan">With a plan</button><button id="noPlan">No plan yet</button></div>
  <p class="hint">The whole app with example data. Today → Set up a plan, Start a workout, or Build your own. Each screen is the latest design prototype.</p>
  <div class="phone" id="phone">
    <div class="top"><span id="topL">9:41</span><span>●●● 100%</span></div>
    <div class="psub" id="psub"></div>
    <div class="view" id="view">
      <section class="native" id="todayNo"></section>
      <section class="native" id="library"></section>
      <section class="native" id="profile"></section>
      <section class="native" id="summary"></section>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="today">TODAY</button><button data-tab="library">LIBRARY</button><button data-tab="progress">PROGRESS</button><button data-tab="profile">PROFILE</button>
    </nav>
    <div class="toast" id="toast"></div>
  </div>
</div>
<script>
// Screens: a tab root or a pushed screen. Prototype screens are iframes kept alive, so their state survives switching.
const PAGES = {
  today: () => (A.plan ? 'training-blocks.html' : null), // no plan: the native Today below (workout-builder-v3.md, No plan)
  // One Progress page (Ben, 22 Oct): with a plan it carries the block (header, plan lines); without, the plain v3 page.
  progress: () => (A.plan ? 'training-blocks.html#progress' : 'progress-simple.html'),
  plan: () => 'plan-builder.html',
  planview: () => 'plan-builder.html#view',
  builder: () => 'workout-builder-v3.html',
  active: () => 'workout-active-v3.html',
};
const NATIVE = ['todayNo', 'library', 'profile', 'summary'];
const A = { tab: 'today', stack: [], plan: false, ptab: 'overview' };
const $ = (id) => document.getElementById(id);
const frames = {};
function frame(src) {
  if (!frames[src]) { const f = document.createElement('iframe'); f.addEventListener('load', () => { f.dataset.ready = '1'; }); const [file, hash] = src.split('#'); f.src = file + '?embed=1' + (hash ? '#' + hash : ''); f.title = src; $('view').appendChild(f); frames[src] = f; }
  return frames[src];
}
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2200); }
function current() { return A.stack.at(-1) ?? A.tab; }
function show() {
  const cur = current(), pushed = A.stack.length > 0;
  Object.values(frames).forEach((f) => f.classList.remove('on'));
  NATIVE.forEach((n) => $(n).classList.remove('on'));
  const src = PAGES[cur]?.(), nat = src ? null : (cur === 'today' ? 'todayNo' : cur);
  if (src) frame(src).classList.add('on');
  else { $(nat).classList.add('on'); ({ todayNo: renderTodayNo, library: renderLibrary, profile: renderProfile, summary: renderSummary })[nat](); }
  $('tabs').style.display = pushed ? 'none' : '';
  $('psub').classList.remove('on');
  document.querySelectorAll('[data-tab]').forEach((b) => b.classList.toggle('on', b.dataset.tab === A.tab));
  $('topL').innerHTML = pushed && cur !== 'summary' ? `<button class="back" id="backBtn">‹ ${A.tab === 'today' ? 'Today' : A.tab[0].toUpperCase() + A.tab.slice(1)}</button>` : '9:41';
  if ($('backBtn')) $('backBtn').onclick = pop;
}
function push(r) { A.stack.push(r); show(); }
function pop() { A.stack.pop(); show(); }
function home(msg) { A.stack = []; A.tab = 'today'; show(); if (msg) toast(msg); }
document.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => { A.tab = b.dataset.tab; A.stack = []; show(); });

// Buttons inside the screen prototypes send where to go (see build_app.py for which button goes where).
addEventListener('message', (e) => {
  const to = e.data?.app; if (!to) return;
  if (to === 'back') return A.stack.length ? pop() : home();
  if (to === 'applied') { A.plan = true; ['plan-builder.html', 'plan-builder.html#view'].forEach((k) => { frames[k]?.remove(); delete frames[k]; }); return home('Plan applied'); }
  if (to === 'changed') return; // edits apply inside the overview
  if (to === 'dotoday') { A.tab = 'today'; A.stack = []; show(); const f = frame(PAGES.today()); const send = () => f.contentWindow.postMessage({ cmd: 'day', day: e.data.day }, '*'); if (f.dataset.ready) send(); else f.addEventListener('load', () => setTimeout(send, 50), { once: true }); return; }
  if (to === 'planupdate') {
    // Today's Start prompt › Update in your plan: open the plan overview with today's changes as changes to review.
    A.tab = 'library'; A.stack = ['planview']; show();
    const f = frame(PAGES.planview()), send = () => f.contentWindow.postMessage({ cmd: 'edit', change: e.data.change }, '*');
    if (f.dataset.ready) send(); else f.addEventListener('load', () => { f.dataset.ready = '1'; setTimeout(send, 50); }, { once: true });
    return;
  }
  if (to === 'paused' || to === 'resumed') { A.paused = to === 'paused'; return; }
  if (to === 'endplan') { A.plan = false; A.paused = false; frames['plan-builder.html#view']?.remove(); delete frames['plan-builder.html#view']; A.stack = []; A.tab = 'library'; show(); return toast('Plan ended'); }
  if (to === 'finished') { A.stack = ['summary']; return show(); }
  if (to === 'discarded') return home('Workout discarded');
  if (to === 'library' || to === 'profile' || to === 'progress') { A.tab = to; A.stack = []; return show(); }
  push(to);
});

// ---------- Today with no plan (workout-builder-v3.md §states, No plan) ----------
// No day tabs. One row: No plan · Set up a plan. Up next comes from the old resolver: Profile split, else routines in
// rotation, else the longest gap; here the longest gap (Back, last trained 13 Oct). Start is one tap.
const STRIP = [['SAT', 17, 'Shoulders', 'done'], ['SUN', 18, 'Run 12k', 'run'], ['MON', 19, '', ''], ['TODAY', 20, '', 'today'], ['WED', 21, '', ''], ['THU', 22, '', ''], ['FRI', 23, '', '']];
// No plan, Up next still adjustable before Start (Ben, 22 Oct): same controls as Today with a plan, today only, with the
// same fit-to-time (rests, supersets, then the cheapest cut; main lift kept; note after Time in light orange).
// Days come from Profile › Split; the suggested one is marked NEXT. Picking another is today only (the suggestion moves on).
const TN_DAYS = {
  Back: { mains: [['Row', 'Barbell row'], ['Pull-up', 'Pull-up']], last: 'last Back 13 Oct', focused: [['Lat pulldown', 1], ['Chest-supported row', 1], ['Hammer curl', 0]], varied: [['Single-arm DB row', 1], ['Straight-arm pulldown', 0], ['Incline DB curl', 0]] },
  Chest: { mains: [['Bench', 'Bench press'], ['Incline', 'Incline bench press']], last: 'last Chest 19 Oct', focused: [['Incline DB press', 1], ['Cable fly', 0], ['Triceps pushdown', 0]], varied: [['Machine chest press', 1], ['Pec deck', 0], ['Overhead triceps extension', 0]] },
  Legs: { mains: [['Squat', 'Back squat'], ['Leg press', 'Leg press']], last: 'last Legs 17 Oct', focused: [['Romanian deadlift', 1], ['Leg curl', 0], ['Calf raise', 0]], varied: [['Hack squat', 1], ['Seated leg curl', 0], ['Seated calf raise', 0]] },
  Shoulders: { mains: [['DB press', 'DB shoulder press'], ['Machine', 'Machine shoulder press']], last: 'last Shoulders 17 Oct', focused: [['Lateral raise', 0], ['Face pull', 0], ['Barbell curl', 0]], varied: [['Cable lateral raise', 0], ['Rear delt fly', 0], ['Hammer curl', 0]] },
};
const TN_NEXT = 'Back';
const TN = { day: TN_NEXT, main: null, style: 'Focused', min: 60, abs: true, ss: true };
const tnMain = () => TN.main ?? TN_DAYS[TN.day].mains[0][0];
const tnChanged = () => TN.day !== TN_NEXT || tnMain() !== TN_DAYS[TN.day].mains[0][0] || TN.style !== 'Focused' || TN.min !== 60 || !TN.abs || !TN.ss;
function tnWorkout() {
  const D = TN_DAYS[TN.day], acc = TN.style === 'Focused' ? D.focused : D.varied;
  let ex = [{ n: D.mains.find(([k]) => k === tnMain())[1], main: true, sets: 4, comp: 1 }, ...acc.map(([n, c]) => ({ n, sets: 3, comp: c })), ...(TN.abs ? [{ n: 'Cable crunch', abs: true, sets: 3 }] : [])];
  const mins = (l, rest = 1, ss = TN.ss) => 4 + l.reduce((m, e) => m + e.sets * (e.main ? 4 : e.comp ? 3 : 2.2) * rest * (ss && !e.main ? 0.85 : 1) + 1.5, 0);
  if (mins(ex) <= TN.min) return { ex, est: Math.round(mins(ex)), note: '' };
  const rest = 0.85; let note = 'shorter rests', ssOn = TN.ss;
  if (mins(ex, rest) > TN.min && !TN.ss) { ssOn = true; note = 'supersets'; }
  const val = (e) => e.abs ? 2.5 : e.comp ? 3 : 2, per = (e) => (e.comp ? 3 : 2.2) * rest;
  const n0 = ex.length, s0 = ex.reduce((a, e) => a + e.sets, 0);
  while (mins(ex, rest, ssOn) > TN.min) {
    const over = mins(ex, rest, ssOn) - TN.min, opts = [];
    ex.forEach((e, k) => { if (e.main) return; if (e.sets > 2) opts.push({ k, drop: false, lost: val(e), saves: per(e) }); if (ex.length > 2) opts.push({ k, drop: true, lost: val(e) * e.sets, saves: per(e) * e.sets + 1.5 }); });
    if (!opts.length) break;
    const o = opts.filter((x) => x.saves >= over).sort((a, b) => a.lost - b.lost)[0] ?? opts.sort((a, b) => a.lost / a.saves - b.lost / b.saves)[0];
    if (o.drop) ex.splice(o.k, 1); else ex[o.k].sets -= 1;
  }
  const dropped = n0 - ex.length, cut = s0 - ex.reduce((a, e) => a + e.sets, 0);
  if (dropped) note = `−${dropped} exercise${dropped > 1 ? 's' : ''}`; else if (cut) note = `−${cut} set${cut > 1 ? 's' : ''}`;
  return { ex, est: Math.min(TN.min, Math.round(mins(ex, rest, ssOn))), note };
}
function renderTodayNo() {
  const w = tnWorkout();
  $('todayNo').innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><h1>Tuesday</h1><button class="secondary" style="flex:none;min-height:40px;padding:0 16px;font-size:15px" id="tnCoach">✦ Coach</button></div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">${STRIP.map(([d, n, t, k]) => `<div style="border-radius:12px;padding:6px 0;text-align:center;background:var(--surface);${k === 'today' ? 'box-shadow:inset 0 0 0 1.5px var(--text)' : ''}"><div style="font-size:10px;color:var(--text2);letter-spacing:.06em">${d}</div><div style="font-size:17px;font-weight:600">${n}</div><div style="font-size:9.5px;min-height:14px;margin:2px 3px 0;border-radius:6px;${k === 'done' ? 'background:var(--done-sub);color:var(--done)' : k === 'run' ? 'background:#172636;color:#7FB2E5' : ''}">${t}</div></div>`).join('')}</div>
    <div class="card"><div class="row" id="tnSetup"><span><div class="nm">No plan</div></span><span style="display:flex;gap:6px;align-items:center">Set up a plan <span class="chev">›</span></span></div></div>
    <div class="daypick">${[TN_NEXT, ...Object.keys(TN_DAYS).filter((d) => d !== TN_NEXT)].map((d) => `<button class="${TN.day === d ? 'on' : ''}" data-tnday="${d}">${d}${d === TN_NEXT ? '<i>NEXT</i>' : ''}</button>`).join('')}<button data-tnmore="1" aria-label="Other workouts">⋯</button></div>
    <div class="card" style="padding:14px 16px;display:flex;flex-direction:column;gap:10px">
      <div class="label" style="margin:0">${TN.day === TN_NEXT ? 'Up next' : 'Today'}</div>
      <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:28px;font-weight:600">${TN.day}</span><span style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;color:var(--text2);font-size:13px"><span>${w.ex.length} exercises · ~${w.est} min</span>${tnChanged() ? '<span style="color:var(--warn);font-weight:600;font-size:12px">Today only</span>' : ''}</span></div>
      <div style="color:var(--text2);font-size:14px">${TN.day === TN_NEXT ? 'Longest since you trained it' : 'Picked by you'} · ${TN_DAYS[TN.day].last}</div>
      <div class="ctl">
        <div class="cr"><span class="k">Main lift</span><span class="opts">${TN_DAYS[TN.day].mains.map(([m]) => `<button class="${tnMain() === m ? 'on' : ''}" data-tn="main" data-v="${m}">${m}</button>`).join('')}</span></div>
        <div class="cr"><span class="k">Accessories</span><span class="opts">${['Focused', 'Varied'].map((m) => `<button class="${TN.style === m ? 'on' : ''}" data-tn="style" data-v="${m}">${m}</button>`).join('')}</span></div>
        <div class="cr"><span class="k">Time${w.note ? `<span class="kn">&nbsp;· ${w.note}</span>` : ''}</span><span class="tv"><button data-tn="min" data-v="-5">−</button><b>${TN.min} min</b><button data-tn="min" data-v="5">+</button></span></div>
        <div class="cr"><span class="k">Abs</span><button class="sw${TN.abs ? ' on' : ''}" data-tn="abs" aria-label="Abs"><i></i></button></div>
        <div class="cr"><span class="k">Supersets</span><button class="sw${TN.ss ? ' on' : ''}" data-tn="ss" aria-label="Supersets"><i></i></button></div>
      </div>
      <button class="primary" id="tnStart">Start</button>
    </div>
    <div class="foot" style="margin-top:0"><button class="secondary" id="tnBuild">Build your own</button><button class="secondary" id="tnAct">＋ Activity</button></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">${['Full body', 'Upper', 'Push', 'Empty workout'].map((t) => `<button class="secondary" style="flex:none;min-height:34px;padding:0 12px;font-size:13px" data-tnother="${t}">${t}</button>`).join('')}</div>`;
  $('tnSetup').onclick = () => push('plan');
  $('tnStart').onclick = () => push('active');
  $('todayNo').querySelectorAll('[data-tnday]').forEach((b) => b.onclick = () => { TN.day = b.dataset.tnday; TN.main = null; renderTodayNo(); });
  $('todayNo').querySelector('[data-tnmore]').onclick = () => toast('Other workouts: Full body, Upper, Push, saved workouts');
  $('todayNo').querySelectorAll('[data-tn]').forEach((b) => b.onclick = () => { const k = b.dataset.tn, v = b.dataset.v; if (k === 'min') TN.min = Math.max(20, Math.min(120, TN.min + +v)); else if (k === 'abs' || k === 'ss') TN[k] = !TN[k]; else TN[k] = v; renderTodayNo(); });
  $('tnBuild').onclick = () => push('builder');
  $('tnAct').onclick = () => toast('Log a run or activity (weekly-plan.md)');
  $('tnCoach').onclick = () => toast('Ask the coach');
  $('todayNo').querySelectorAll('[data-tnother]').forEach((b) => b.onclick = () => push(b.dataset.tnother === 'Empty workout' ? 'active' : 'builder'));
}

// ---------- Library (exercise-library.md, routines.md): workouts and exercises ----------
const LIB = { tab: 'plan' };
const EXS = { Chest: ['Bench press', 'Incline DB press', 'Cable fly', 'DB bench press'], Back: ['Barbell row', 'Lat pulldown', 'Pull-up', 'Chest-supported row'], Shoulders: ['DB shoulder press', 'Lateral raise', 'Face pull'], Legs: ['Back squat', 'Romanian deadlift', 'Leg press', 'Leg curl', 'Calf raise'], Arms: ['Barbell curl', 'Hammer curl', 'Triceps pushdown'], Core: ['Cable crunch', 'Hanging leg raise', 'Plank'] };
// Your own exercises (exercise-library.md §2.6): added here, tagged Yours, usable by plans and the coach.
const MINE = [];
function renderLibrary() {
  // Library tabs Plan | Workouts | Exercises (Ben, 22 Oct). Plan: the active plan opens its overview (Edit plan, Pause,
  // End there); previous and saved plans below.
  const tabs = [['plan', 'Plan'], ['workouts', 'Workouts'], ['exercises', 'Exercises']];
  const rows = (list, attr) => `<div class="card">${list.map(([n, sub, v]) => `<div class="row" ${attr}="${v ?? n}"><span><div class="nm">${n}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</span><span class="chev">›</span></div>`).join('')}</div>`;
  $('library').innerHTML = `<h1>Library</h1>
    <div class="seg" style="grid-template-columns:repeat(3,1fr)">${tabs.map(([k, t]) => `<button data-lt="${k}" class="${LIB.tab === k ? 'on' : ''}">${t}</button>`).join('')}</div>
    ${LIB.tab === 'plan' ? `
      <div class="label">Current</div>
      <div class="card">${A.plan ? `<div class="row" data-go="planview"><span><div class="nm">Strength block <span class="tag" style="margin-left:6px">${A.paused ? 'Paused' : 'Active'}</span></div><div class="sub">Chest / Legs / Shoulders / Back · week 3 of 6</div></span><span class="chev">›</span></div>` : `<div class="row" data-go="plan"><span><div class="nm">Set up a plan</div><div class="sub">Goals, week, preferences</div></span><span class="chev">›</span></div>`}</div>
      <div class="label">Previous and saved</div>
      ${rows([['Summer PPL', 'Push / Pull / Legs · ended 20 Sep'], ['Hotel weeks', 'Full body · 3 days · saved']], 'data-oldplan')}`
    : LIB.tab === 'workouts' ? `
      ${rows([['Push A', 'Last done Mon'], ['Pull A', 'Last done Wed'], ['Legs', 'Last done Sat'], ['Arms & core', '3 weeks ago']], 'data-wo')}
      <div class="foot"><button class="secondary" data-go="builder">＋ Build a workout</button></div>`
    : `<div class="mfilter">${['All', ...Object.keys(EXS)].map((g) => `<button class="${(LIB.muscle ?? 'All') === g ? 'on' : ''}" data-mf="${g}">${g}</button>`).join('')}</div>
      <div class="search">Search exercises</div>
      ${LIB.adding ? `<div class="card" style="padding:12px 14px;display:flex;flex-direction:column;gap:10px"><b>Add your own</b><input id="ownName" placeholder="Exercise name" style="min-height:42px;border-radius:10px;border:1px solid var(--divider);background:var(--canvas);color:var(--text);padding:0 12px;font:15px var(--ui)"><div class="mfilter">${Object.keys(EXS).map((g) => `<button class="${LIB.ownMuscle === g ? 'on' : ''}" data-om="${g}">${g}</button>`).join('')}</div><div class="foot" style="margin-top:0"><button class="secondary" style="min-height:44px" id="ownCancel">Cancel</button><button class="primary" style="min-height:44px" id="ownSave">Save</button></div></div>` : `<button class="secondary" style="min-height:44px;flex:none" id="ownAdd">＋ Add your own</button>`}
      ${Object.entries(EXS).filter(([g]) => (LIB.muscle ?? 'All') === 'All' || LIB.muscle === g).map(([g, l]) => { const all = [...MINE.filter((m) => m.g === g).map((m) => [m.n, true]), ...l.map((n) => [n, false])]; return `<div class="label">${g}</div><div class="card">${all.map(([n, mine]) => `<div class="row" data-ex="${n}"><span class="nm">${n}${mine ? ' <span class="tag" style="margin-left:6px">Yours</span>' : ''}</span><span class="chev">›</span></div>`).join('')}</div>`; }).join('')}`}`;
  $('library').querySelectorAll('[data-mf]').forEach((b) => b.onclick = () => { LIB.muscle = b.dataset.mf; renderLibrary(); });
  $('library').querySelectorAll('[data-om]').forEach((b) => b.onclick = () => { LIB.ownName = $('ownName').value; LIB.ownMuscle = b.dataset.om; renderLibrary(); $('ownName').value = LIB.ownName; });
  if ($('ownAdd')) $('ownAdd').onclick = () => { LIB.adding = true; LIB.ownMuscle = LIB.muscle && LIB.muscle !== 'All' ? LIB.muscle : 'Chest'; LIB.ownName = ''; renderLibrary(); $('ownName').focus(); };
  if ($('ownCancel')) $('ownCancel').onclick = () => { LIB.adding = false; renderLibrary(); };
  if ($('ownSave')) $('ownSave').onclick = () => { const n = $('ownName').value.trim(); if (!n) return toast('Name it first'); MINE.push({ n, g: LIB.ownMuscle }); LIB.adding = false; renderLibrary(); toast(`${n} added`); };
  $('library').querySelectorAll('[data-lt]').forEach((b) => b.onclick = () => { LIB.tab = b.dataset.lt; renderLibrary(); });
  $('library').querySelectorAll('[data-go]').forEach((b) => b.onclick = () => push(b.dataset.go));
  $('library').querySelectorAll('[data-wo]').forEach((b) => b.onclick = () => push('builder'));
  // Plans live in Library (Ben, 22 Oct): the active plan opens its overview (Edit plan, Pause, End there); old and saved plans below.
  $('library').querySelectorAll('[data-oldplan]').forEach((b) => b.onclick = () => toast(`${b.dataset.oldplan}: view, or start it again`));
  $('library').querySelectorAll('[data-ex]').forEach((b) => b.onclick = () => toast(`${b.dataset.ex}: guide, history and swaps (exercise-library.md §2.4)`));
}

// ---------- Profile (profile-and-settings.md §2.1) ----------
function renderProfile() {
  const sec = (t, rows) => `<div class="label">${t}</div><div class="card">${rows.map(([n, s, go]) => `<div class="row" ${go ? `data-go="${go}"` : 'data-na="1"'}><span><div class="nm">${n}</div>${s ? `<div class="sub">${s}</div>` : ''}</span><span class="chev">›</span></div>`).join('')}</div>`;
  $('profile').innerHTML = `<h1>Profile</h1>
    ${sec('Training', [['Split', A.plan ? 'Set by your plan' : 'Chest · Legs · Shoulders · Back', A.plan ? 'tab:library' : null], ['Pain flags', 'None'], ['Logging', 'kg · RPE after the set'], ['Rest presets', '1:00 · 1:30 · 3:00']])}
    ${sec('Gyms', [['Main gym', 'Default · full gym'], ['＋ Add gym', '']])}
    ${sec('Voice & alerts', [['Voice & alerts', 'Set cues · Apple voice']])}
    ${sec('Coach', [['Coach connection', 'Connected'], ['What the coach remembers', '7 confirmed'], ['Guides & playbook', 'Playbook v1']])}
    ${sec('Data', [['Data & backup', 'Backed up on this phone · 19:05'], ['Import', 'FitNotes or any app']])}
    ${sec('App', [['Appearance', 'System'], ['About this build', '0.1.0']])}`;
  // With a plan the plan's split is used: Profile › Split points to Library › Your plan (Ben, 22 Oct).
  $('profile').querySelectorAll('[data-go]').forEach((b) => b.onclick = () => { const g = b.dataset.go; if (g.startsWith('tab:')) { A.tab = g.slice(4); A.stack = []; show(); } else push(g); });
  $('profile').querySelectorAll('[data-na]').forEach((b) => b.onclick = () => toast('Not in this prototype'));
}

// ---------- Workout summary (workout-summary.md §2) ----------
const SUM = { undone: {} };
function renderSummary() {
  const next = [['Bench press', 'Target 105 kg × 6', '+2.4%', 'All sets hit at RPE 8.'], ['Incline DB press', 'Target 32 kg each × 8–10', '+6.7%', '10 reps on every set at 30 kg.'], ['Triceps pushdown', 'Same: 35 kg × 10–12', '0%', 'Only 1 of 3 sets logged; holding.']];
  $('summary').innerHTML = `<div class="banner">✓ Workout saved on this phone</div>
    <h1>Upper B</h1><div style="color:var(--text2);font-size:14px;margin-top:-6px">Thu 22 Oct · Main gym · 18:02–19:04</div>
    <div class="stats"><div class="stat"><b>54 min</b><span>Active</span></div><div class="stat"><b>16</b><span>Sets</span></div><div class="stat"><b>14/15</b><span>Planned</span></div></div>
    <div class="label">Compared with last time</div>
    <div class="card" style="padding:10px 16px"><div style="display:flex;justify-content:space-between"><span>Bench press · top set</span><span class="tag pb">PB</span></div>
      <div style="display:grid;grid-template-columns:1fr auto;gap:4px;margin-top:8px;font-variant-numeric:tabular-nums"><span style="color:var(--text2)">Today</span><b>102.5 kg × 6</b><span style="color:var(--text2)">15 Oct</span><span>100 kg × 6</span></div></div>
    <div class="label">Next time · Upper B</div>
    <div class="card">${next.map(([n, t, pct, why], i) => `<div class="row" style="cursor:default;align-items:flex-start;padding:10px 0"><span><div class="nm">${n}</div><div class="sub">${SUM.undone[i] ? 'Back to rule: same as today' : `${t} · ${pct}`}</div><div class="sub" style="color:var(--text3)">${why}</div></span>${SUM.undone[i] ? '' : `<button class="link" data-undo="${i}">Undo</button>`}</div>`).join('')}</div>
    <div class="foot"><button class="secondary" id="sumEdit">Edit</button><button class="primary" id="sumDone">Done</button></div>`;
  $('summary').querySelectorAll('[data-undo]').forEach((b) => b.onclick = () => { SUM.undone[+b.dataset.undo] = true; renderSummary(); });
  $('sumDone').onclick = () => home();
  $('sumEdit').onclick = () => toast('Edit workout (delete-workouts.md)');
}

$('reset').onclick = () => { Object.values(frames).forEach((f) => f.remove()); for (const k in frames) delete frames[k]; Object.assign(A, { tab: 'today', stack: [], plan: false }); SUM.undone = {}; show(); };
$('withPlan').onclick = () => { A.plan = true; home(); };
$('noPlan').onclick = () => { A.plan = false; home(); };
show();
</script>
